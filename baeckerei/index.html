  else if (pts.size === 1) { if (Math.hypot(f[0] - downAt[0], f[1] - downAt[1]) > 0.012) moved = true; if (moved) pan(prev[0] - f[0], prev[1] - f[1]); }
});
const pUp = e => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size && !moved && e.type === 'pointerup') { S.selected = hitTest(e.clientX, e.clientY); renderSel(); } };
cv.addEventListener('pointerup', pUp); cv.addEventListener('pointercancel', pUp);
cv.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });
cv.addEventListener('wheel', e => { e.preventDefault(); const [fx, fy] = frac(e); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, fx, fy); }, { passive: false });
$('zoomIn').addEventListener('click', () => zoomAt(1.25, 0.5, 0.5)); $('zoomOut').addEventListener('click', () => zoomAt(1 / 1.25, 0.5, 0.5));

// ================= Главный цикл =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.speed > 0) advance(dt * MIN_PER_SEC * S.speed);
  render();
  uiT += dt; if (uiT > 0.3) { uiT = 0; renderTop(); renderSel(); if (!document.querySelector('#panel:hover') || tab === 'log') renderPanel(); }
  requestAnimationFrame(frame);
}
resize(); renderTop(); renderSel(); renderPanel();
log(L('Добро пожаловать в Bäckerei! 05:00: ночная смена уже печёт, в 05:30 придёт продавщица, в 06:00 откроется магазин. Заказ отеля нужно отвезти к 07:00.', 'Willkommen in der Bäckerei! 05:00: Die Nachtschicht backt schon, um 05:30 kommt die Verkäuferin, um 06:00 öffnet der Laden. Der Hotelauftrag muss bis 07:00 ausgeliefert sein.'), 'info');
applyLang();
try { if (!localStorage.getItem('bw-tut')) showTut(0); } catch (e) { showTut(0); }
requestAnimationFrame(frame);

window.BW = {
  skipNight, showTut, applyLang, S, ST, STATIONS, DISPLAYS, PRODUCTS, advance, buyUpgrade, orderSupplies,
  setSpeed: v => { S.speed = v; }, setPlan: (k, n) => { S.plan[k] = n; },
  summary: () => ({ day: day(), clock: fmt(clock()), money: Math.round(S.money), today: { ...S.d }, yesterday: { ...S.y },
    stations: { kneter: ST.kneter.batch ? ST.kneter.batch.prod + ':' + ST.kneter.batch.stage : '-', gaer: gaer().trays.length, rack: rack().trays.length, lauge: ST.lauge.trays.length, ofen: ST.ofen.deck.map(d => d.state + (d.prod ? ':' + d.prod : '') + ':' + d.trays.length).join(' | '), tisch1: ST.tisch1.batch ? ST.tisch1.batch.prod + ':' + ST.tisch1.batch.left : '-', tisch2: ST.tisch2.batch ? ST.tisch2.batch.prod + ':' + ST.tisch2.batch.left : '-', presse: ST.presse.batch ? 'br:' + ST.presse.batch.left : '-' },
    display: Object.fromEntries(DISPLAYS.map(d => [d.prod, d.stock])), started: { ...S.started }, mats: { ...S.mats },
    workers: S.workers.map(w => `${w.name.split(' ')[0]}: ${jobText(w)} (${Math.round(w.energy)}%)`), customers: S.customers.length, order: S.order && S.order.state }),
};
})();
