<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reifenwerk</title>
<style>
  :root {
    --bg: #17191e; --panel: #22252c; --panel2: #2a2e37; --line: #363b46;
    --text: #e7e7e7; --muted: #9aa0aa; --accent: #f0a030; --good: #62c370; --bad: #e35d5d; --info: #5aa8e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  #topbar .stat b { font-variant-numeric: tabular-nums; }
  .speed button { min-width: 38px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  #wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; background: rgba(20,22,27,.95); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 320px; display: none; font-size: 12px; }
  #side { width: 420px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #sel { padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 64px; }
  #tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1 1 auto; border: 0; border-radius: 0; background: transparent; padding: 7px 2px; color: var(--muted); font-size: 12px; }
  #tabs button .dot { display: inline-block; min-width: 14px; padding: 0 3px; margin-left: 2px; border-radius: 7px; background: var(--accent); color: #1a1a1a; font-size: 10px; font-weight: 700; }
  #evbar { max-height: 38vh; overflow-y: auto; }
  #evbar:empty { display: none; }
  .ev { margin: 0 0 8px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: #2d2a22; }
  .ev.good { border-left-color: var(--good); background: #22302a; color: var(--text); }
  .ev.bad { border-left-color: var(--bad); background: #322326; color: var(--text); }
  .ev.info { border-left-color: var(--info); background: #222b36; color: var(--text); }
  .ev .evt { font-weight: 700; } .ev .evx { font-size: 12px; margin: 3px 0; color: #d6d6d6; }
  .ev .evc { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
  .ev .evc button { text-align: left; } .ev .evc button small { display: block; color: var(--muted); font-size: 11px; }
  .ev.chip { padding: 4px 9px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .lock { color: var(--muted); font-size: 11px; }
  #evbar .ev { margin: 6px 8px; }
  .skills button { padding: 0 5px; font-size: 11px; margin-left: 2px; }
  .skills td, .skills th { padding: 2px 3px; }
  .sk { font-size: 9px; color: var(--muted); line-height: 1.1; text-align: center; }
  .sk b { display: block; height: 2px; background: #111; margin: 1px 2px 0; } .sk b i { display: block; height: 100%; background: var(--info); }
  #tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); background: transparent; }
  #panel { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--accent); } .info { color: var(--info); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .prio { width: 24px; padding: 2px 0; text-align: center; font-weight: 700; }
  .p1 { background: #2f6b3a; } .p2 { background: #4f6b2f; } .p3 { background: #6b5d2f; } .p4 { background: #6b412f; } .p0 { background: #2a2e37; color: #555; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar { height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); }
  .log div { padding: 2px 0; border-bottom: 1px dashed #30343d; }
  h3 { margin: 4px 0 8px; font-size: 13px; color: var(--accent); }
  .shift { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #3a3f4b; color: #ccc; }
  @media (max-width: 900px) { body { flex-direction: column; } #side { width: 100%; height: 45vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="main">
  <div id="topbar">
    <span class="title">REIFENWERK</span>
    <span class="stat">День <b id="tDay">1</b>, <b id="tClock">06:00</b> <span id="tShift" class="muted"></span></span>
    <span class="stat">Касса: <b id="tMoney">0 €</b></span>
    <span class="stat" title="Уровень компании: растёт за отгруженные шины, цели и события (очки развития) при достаточной репутации">Уровень: <b id="tLvl">1</b></span>
    <span class="stat">Репутация: <b id="tRep">50</b></span>
    <span class="stat" title="Настроение команды: влияет на скорость работы и больничные">Настроение: <b id="tMor">70</b></span>
    <span class="stat">Сегодня: <b id="tToday">0</b> шин</span>
    <button id="gfxBtn" title="Переключить графику">🎨 Графика: пиксели</button>
    <span><button id="zoomOut" title="Отдалить (−, колесо мыши)">🔍−</button> <button id="zoomIn" title="Приблизить (+, колесо мыши). Двигать: WASD или правая кнопка мыши">🔍+</button></span>
    <span class="speed">
      <button data-speed="0" title="Пауза (Пробел)">⏸</button>
      <button data-speed="1" title="1">1×</button>
      <button data-speed="3" title="2">3×</button>
      <button data-speed="10" title="3">10×</button>
    </span>
    <span><button id="skipNight" title="Ночью смены нет: досчитать ночь до 05:55 одним щелчком (прессы, грузовики, события считаются честно)" style="display:none;background:#2f4f6b;border-color:#5aa8e6">⏩ Пропустить ночь</button> <label class="muted" title="Каждую ночь пропускать автоматически"><input type="checkbox" data-autonight> ночь авто</label></span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
</div>
<div id="side">
  <div id="evbar"></div>
  <div id="sel"></div>
  <div id="tabs">
    <button data-tab="overview" class="on">Цех</button>
    <button data-tab="workers">Люди</button>
    <button data-tab="orders">Заказы</button>
    <button data-tab="stock">Склад</button>
    <button data-tab="upgrades">Апгрейды</button>
    <button data-tab="research">Наука</button>
    <button data-tab="dev">Развитие</button>
    <button data-tab="finance">Финансы</button>
    <button data-tab="events">События<span id="evDot"></span></button>
    <button data-tab="log">Журнал</button>
  </div>
  <div id="panel"></div>
</div>
<script src="pixel.js"></script>
<script>
'use strict';
(() => {
// ================= Константы =================
const TILE = 24, MW = 76, MH = 52;
const MIN_PER_SEC = 0.75;     // игровых минут в реальную секунду на скорости 1×
const WALK = 18;              // клеток за игровую минуту (клетка ≈ 1,5 м, ≈ 0,45 м/с с учётом манёвров)
const TRUCK_SPEED = 9;
const DAY_START = 6 * 60, SHIFT_CHANGE = 14 * 60, DAY_END = 22 * 60;
const WAGE_PER_HOUR = 21, OVERHEAD_PER_DAY = 2800;
const FORK = 6;                                   // шин на вилах погрузчика за рейс
const CART = 4;                                   // шин на тележке (Rollwagen)
const liftTime = (j, what, w) => (j.crane === what ? 1.5 * (tier(w, 'vulkan') >= 1 ? 0.7 : 1) : j.fork || j.cart ? 0.8 : 0.5) * S.liftMul; // подъёмники (Hebehilfe), Lean, перк «Kranführer»
const DUSTY = ["rauen", "ausschl", "entgr"];       // участки, где сыплется резиновая пыль и стружка
const BREAK_MIN = 1000;                           // средняя наработка на отказ, минут работы (пыль и износ ускоряют)
// Типичные поломки по участкам: немецкое название — что случилось
const FAULTS = {
  pruef: [['Spreizer-Hydraulik undicht', 'течёт гидравлика расширителя бортов'], ['Prüflampe defekt', 'перегорела лампа осмотра']],
  rauen: [['Raspelmesser stumpf', 'затупились ножи рашпиля'], ['Antriebsriemen gerissen', 'порвался приводной ремень'], ['Felgenspanner klemmt', 'заело зажим обода']],
  ausschl: [['Druckluftschlauch geplatzt', 'лопнул шланг сжатого воздуха'], ['Schleifer defekt', 'сломалась пневмошлифовка']],
  spray: [['Sprühdüse verstopft', 'засорилась форсунка'], ['Absaugung ausgefallen', 'отказала вытяжка']],
  fuellen: [['Extruder-Heizung defekt', 'не греет пистолет-экструдер'], ['Schnecke blockiert', 'заклинило шнек экструдера']],
  pflaster: [['Spreizer-Pneumatik undicht', 'течёт пневматика расширителя'], ['Andrückpresse klemmt', 'заело пресс прижима пластыря']],
  aufbau: [['Extruder der Wickelmaschine verstopft', 'забился экструдер намоточной машины'], ['Wickeltrommel klemmt', 'заело барабан намотки']],
  presse: [['Heizbalg undicht', 'течёт варочная камера (Heizbalg)'], ['Dampfventil klemmt', 'заело паровой клапан'], ['Formsegment klemmt', 'заело сегмент пресс-формы']],
  scan: [['Scanner defekt', 'сломался сканер штрихкодов']],
  entgr: [['Entgratmesser stumpf', 'затупился нож обрезного станка'], ['Drehteller klemmt', 'заело вращение станка']],
  endk: [['Prüfmaschine Fehler', 'ошибка машины финального контроля'], ['Etikettendrucker defekt', 'сломался принтер этикеток']],
  antrieb: [['Kette gesprungen', 'соскочила цепь конвейера'], ['Antriebsmotor überhitzt', 'перегрелся мотор привода']],
};

// ================= Случайность (воспроизводимая) =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search);
const rnd = mulberry32(Number(params.get('seed')) || 20261015);
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ================= Карта =================
// Планировка по эталонному цеху (plant/README.md): 1 клетка ≈ 1,5 м.
// Длинная ось корпуса — слева (юго-запад) направо (северо-восток); сверху улица и двор, снизу зона Ф.
const T_GRASS = 0, T_ROAD = 1, T_YARD = 2, T_FLOOR = 3, T_WALL = 4, T_DOOR = 5;
const grid = new Uint8Array(MW * MH), blocked = new Uint8Array(MW * MH);
const I = (x, y) => y * MW + x;
const area = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[I(x, y)] = t; };
const wallH = (y, x0, x1) => area(x0, y, x1, y, T_WALL), wallV = (x, y0, y1) => area(x, y0, x, y1, T_WALL);
area(0, 0, MW - 1, MH - 1, T_YARD);
area(0, 0, MW - 1, 2, T_ROAD);                                   // улица
area(0, 50, MW - 1, MH - 1, T_GRASS); area(72, 3, MW - 1, 12, T_GRASS); area(0, 43, 1, 49, T_GRASS);
area(2, 9, 25, 26, T_FLOOR);                                     // К1 — навес без стен
area(2, 27, 26, 42, T_FLOOR); wallH(27, 2, 26); wallV(2, 27, 42); wallH(42, 2, 26);   // К2 — склад материалов
area(26, 9, 66, 49, T_FLOOR); wallH(9, 26, 66); wallH(49, 26, 66); wallV(26, 9, 49); wallV(66, 9, 49); // главный корпус
area(66, 23, 71, 31, T_FLOOR); wallH(23, 66, 71); wallH(31, 66, 71); wallV(71, 23, 31);              // Р — пандус отгрузки
wallH(16, 26, 35); wallV(35, 9, 23); wallH(23, 26, 66); wallH(40, 26, 66);           // С1|С2, С|С3, левый пролёт|Ж, Ж|Ф
area(66, 24, 66, 30, T_FLOOR);                                   // Ж4 открыт на пандус
for (const [x, y] of [[30, 9], [26, 19], [26, 38], [12, 27], [23, 42], [30, 16], [35, 12], [35, 19], [27, 23], [41, 23], [42, 23], [49, 23],
  [60, 23], [61, 23], [37, 23], [29, 40], [53, 40], [67, 23], [68, 23], [69, 23], [70, 23]]) grid[I(x, y)] = T_DOOR;

const ZONES = [
  { name: 'Pausenraum', kind: 'rest', x: 27, y: 10, w: 8, h: 6, color: 'rgba(110,160,110,.28)' },
  { name: 'Parkplatz', kind: 'parking', x: 38, y: 4, w: 24, h: 4, color: 'rgba(80,80,80,.35)' },
  { name: 'К1 VORDACH', kind: 'shed', x: 2, y: 9, w: 24, h: 18, color: 'rgba(150,140,120,.18)' },
  { name: 'К2 MATERIAL', kind: 'label', x: 3, y: 28, w: 23, h: 14, color: 'rgba(120,110,90,.10)' },
  { name: 'С2 PRÜFUNG', kind: 'label', x: 27, y: 17, w: 8, h: 6, color: 'rgba(90,130,200,.10)' },
  { name: 'С3 KARKASSENLAGER', kind: 'label', x: 36, y: 10, w: 30, h: 13, color: 'rgba(90,130,200,.10)' },
  { name: 'Ж1 VORBEREITUNG', kind: 'label', x: 27, y: 24, w: 12, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж2 AUFBAU', kind: 'label', x: 39, y: 24, w: 8, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ж3 PRESSEN', kind: 'label', x: 47, y: 24, w: 7, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж4 FINISH', kind: 'label', x: 54, y: 24, w: 12, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ф KLEINREIFEN', kind: 'label', x: 27, y: 41, w: 39, h: 8, color: 'rgba(150,110,200,.12)' },
];
const DECOR = [
  { id: 'regal', label: 'Materiallager', x: 4, y: 29, w: 8, h: 2, color: '#5b4a3a', desc: 'К2 — склад материалов: протекторы, ремонтная резина (Füllgummi), запчасти. Остатки — во вкладке «Склад».' },
  { id: 'regal', label: '', x: 4, y: 33, w: 8, h: 2, color: '#5b4a3a', desc: 'К2 — склад материалов.' },
  { id: 'kaffee', label: '☕', x: 34, y: 10, w: 1, h: 1, color: '#6b3f2a', desc: 'Кофемашина. Здесь рабочие восстанавливают силы.' },
  { id: 'tisch', label: '', x: 28, y: 12, w: 2, h: 1, color: '#7a5a3a', desc: 'С1: бытовка и столовая (столовая — на втором этаже).' },
  { id: 'tisch', label: '', x: 31, y: 12, w: 2, h: 1, color: '#7a5a3a', desc: 'С1: бытовка и столовая.' },
  { id: 'desk', label: '', x: 33, y: 14, w: 2, h: 1, color: '#5a5f7a', desc: 'Стол мастера: заказы, планирование, качество. Мастер — это вы.' },
  { id: 'schrott', label: 'Container', x: 5, y: 5, w: 12, h: 2, color: '#7a3b2a', desc: 'Огороженная площадка с большими контейнерами. Сюда уходит лом — забракованные каркасы.' },
  { id: 'werkbank', label: 'Werkstatt', x: 27, y: 42, w: 3, h: 1, color: '#6b4a2a', desc: 'Мастерская техника: верстак, тиски, ящик с инструментами и запчасти. Когда станок ломается, техник берёт здесь инструмент и идёт чинить.' },
  { id: 'rohgummi', label: 'Rohgummi', x: 41, y: 37, w: 2, h: 2, color: '#2a2a30', desc: 'Сырая (невулканизированная) резина для намотки. Лежит прямо у машин Ж2: её подвозят, ходить за ней не нужно.' },
  { id: 'm2', label: 'М2', x: 21, y: 44, w: 4, h: 2, color: '#4a4f57', desc: 'М2: контейнеры для резиновых отходов и склад Gummilösung. Когда клей на участке кончается, рабочий идёт сюда за канистрой.' },
  { id: 'm1', label: 'М1', x: 70, y: 44, w: 4, h: 2, color: '#4a4f57', desc: 'М1: мусор — металл (проволока, гвозди) и бумага.' },
  { id: 'autoklav1', label: 'Autoklav', x: 55, y: 43, w: 5, h: 3, color: '#4a7db0', desc: 'Единственный автоклав (холодный метод). Работает отдельно от основной линии, на нём один человек. Пока не моделируется.' },
  { id: 'scanner', label: 'Scan', x: 55, y: 29, w: 2, h: 1, color: '#2c6aa8', short: 'Scan', lastScan: -99, desc: 'Ж4: площадка сканера. Шину с обрезки катят через сканер — он читает штрихкод и записывает весь путь шины по цеху.' },
  ...[32, 35, 38, 41, 44, 47].map(x => ({ id: 'kpresse', label: '', x, y: 44, w: 2, h: 2, color: '#6b5a8a', desc: 'Маленький пресс для шин небольших гоночных машин (мягкая резина). Зона Ф — к ней вернёмся позже.' })),
];
const WERKBANK = { x: 28, y: 43 };
const COFFEE = { x: 33, y: 10 };
const M2_ACCESS = { x: 23, y: 43 };
const SCAN_ACCESS = { x: 55, y: 30 };
const FORK_HOMES = [{ x: 19, y: 8 }, { x: 63, y: 21 }]; // стоянки погрузчиков: у приёмки З и у склада С3
for (const d of DECOR) for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) blocked[I(x, y)] = 1;
const SEATS = [[28, 11], [29, 11], [31, 11], [32, 11], [28, 13], [29, 13], [31, 13], [32, 13], [27, 14], [30, 14], [29, 15]];
const EXIT = { x: 40, y: 6 }, ENTRY = { x: 40, y: 5 };
const SCRAP_ACCESS = { x: 11, y: 7 };
// Ворота: З — приёмка каркасов (въезд), Р — пандус отгрузки готовых шин (выезд). Грузовики едут по улице сверху.
const DOCKS = {
  1: { x: 23, stopY: 5.5, access: { x: 23, y: 9 }, label: 'З ANNAHME', rect: { x: 21, y: 3, w: 5, h: 6 } },
  2: { x: 68, stopY: 18, access: { x: 68, y: 22 }, label: 'Р VERSAND', rect: { x: 66, y: 14, w: 5, h: 9 } },
};
const CAM = { z: 1.5, cx: 46.5, cy: 29 }; // стартовый вид пиксельной графики: линия Ж1–Ж4

// ================= Станции =================
// g = группа (тип станции). next — группа, куда шина идёт дальше. loop — станция на подвесном конвейере (Ж1–Ж2).
const WORKS = ['transport', 'pruefen', 'rauen', 'reparatur', 'belegen', 'vulkan', 'nacharbeit', 'technik'];
const WORK_RU = { transport: 'Транспорт', pruefen: 'Контроль', rauen: 'Рауен', reparatur: 'Ремонт шин', belegen: 'Намотка резины', vulkan: 'Прессы', nacharbeit: 'Обрезка', technik: 'Техник (Instandhaltung)' };

function aStar(sx, sy, tx, ty) {

// Время вулканизации: цикл пресса × рецептура (исследование) × продукт (OTR в 2,2 раза дольше)
const cureTime = s => s.cycle * S.cureMul * prodOf(s.items[0]).cure;
// Робот ABC на намотке, роликовый конвейер Ж2 → Ж3, портальный робот у прессов
const ROBOT = { id: -1, name: 'Roboter ABC', skills: { belegen: 9 } };
function updateRobots(dt) {
  for (const s of GROUP.aufbau) {
    if (!s.robot || s.broken || noPower()) continue;
    if (!s.cur) {
      const k = firstIdx(s.input, id => S.tires.get(id).readyAt <= S.t);
      if (k < 0 || s.out.length >= s.outCap || !matsOk(s)) continue;
      s.cur = s.input.splice(k, 1)[0]; matTake(s, 1); s.rT = 0; s.rDur = s.time * 0.9 * S.tMul.aufbau * prodOf(s.cur).time;
    }
    s.rT += dt; s.prog = s.rT / s.rDur; s.busy += dt; s.wear = Math.min(2, s.wear + dt / 900 * S.wearMul);
    if (rnd() < dt * breakRate(s)) { breakDown(s); continue; }
    if (s.rT >= s.rDur) finishProc(s, ROBOT);
  }
  if (S.rollenbahn) for (const s of GROUP.aufbau) for (let i = s.out.length - 1; i >= 0; i--) {
    const t = S.tires.get(s.out[i]); if (t.res) continue;
    if (t.rollT === undefined) t.rollT = S.t + 1.5; // ~1,5 мин по роликам
    if (S.t >= t.rollT && canAcceptId('puffer')) { const tid = s.out.splice(i, 1)[0]; delete t.rollT; t.res = false; ST.puffer.items.push(tid); }
  }
  // Lade-Portal: один робот на все прессы, ~1,5 мин на операцию (достать на обрезку, зарядить, закрыть форму)
  if (S.upgrades.ladeportal && !pressDown() && S.t >= (S.portalT || 0)) for (const p of GROUP.presse) {
    if (p.broken || p.worker || p.resIn) continue;
    if (p.state === 'done') {
      const tid = p.items.find(id => !S.tires.get(id).res), dst = tid && chooseDst('entgr'); if (!dst) continue;
      p.items.splice(p.items.indexOf(tid), 1); p.state = 'idle'; ST[dst].input.push(tid); S.portalT = S.t + 1.5; break;
    }
    if (p.state !== 'idle') continue;
    if (p.items.length < p.cap) {
      const tid = rushFirst(ST.puffer.items.filter(id => !S.tires.get(id).res))[0]; if (!tid) continue;
      ST.puffer.items.splice(ST.puffer.items.indexOf(tid), 1); p.items.push(tid); p.lastLoad = S.t;
    }
    if (p.items.length >= p.cap) { p.state = 'running'; p.timer = cureTime(p) + 2; scanTire(p, p.items[0], null); S.portalT = S.t + 1.5; break; }
  }
}

// Кандидаты (Bewerber) обновляются каждое утро; чем выше уровень компании, тем сильнее кандидаты
function makeCands() {
  const top = [7, 8, 9, 9, 9][S.level - 1];
  S.cands = Array.from({ length: 3 }, () => {
    const k = pick(WORKS), k2 = pick(WORKS.filter(x => x !== k)), a = RI(top - 3, top), b = RI(3, Math.min(7, a));
    return { id: S.nextId++, name: pick(FIRST) + ' ' + pick(LAST), k, a, k2, b, wage: Math.round((14 + a * 0.8 + b * 0.3) * 2) / 2, fee: 300 + a * 50 };
  });
}
function hireCand(id) {
  const c = S.cands.find(x => x.id === id); if (!c || S.money < c.fee) return false;
  pay(c.fee, 'hiring'); const w = makeWorker(c.name, ROLE[c.k], shiftForNew(), { [c.k]: c.a, [c.k2]: c.b }); w.wage = c.wage; S.workers.push(w);
  S.cands = S.cands.filter(x => x !== c);
  log(`Нанят ${w.name}: ${ROLE[c.k]}, ${WORK_RU[c.k]} ${c.a}, ${w.wage} €/ч (${SHIFTS[w.shift].de}).`, 'good'); return w;
}
function hire() { if (!S.cands.length) makeCands(); return hireCand(S.cands[0].id); }
function addTemp(src) { // Leiharbeiter из Zeitarbeit на время больничного
  const t = makeWorker(pick(FIRST) + ' ' + pick(LAST), 'Leiharbeiter', src.shift, {});
  for (const k of WORKS) t.skills[k] = Math.max(2, src.skills[k] - 2);
  Object.assign(t, { prio: { ...src.prio }, wage: 32, temp: true, leaveAt: src.sickUntil }); S.workers.push(t); return t;
}
function interrupt(w) { releaseJob(w); w.seat = null; }
function removeWorker(w) { if (w.job) interrupt(w); S.workers.splice(S.workers.indexOf(w), 1); if (S.selected && S.selected.w === w) S.selected = null; }
function fire(wid) { // увольнение: выходное пособие (Abfindung) — 5 смен
  const w = S.workers.find(x => x.id === wid); if (!w) return false;
  const sev = w.temp ? 0 : Math.round(w.wage * 8 * 5); pay(sev, 'hiring'); removeWorker(w); if (!w.temp) addMorale(-5);
  log(`${w.name} уволен(а)${sev ? `, Abfindung ${eur(sev)}` : ''}. Настроение команды −5.`, 'warn'); return true;
}
const courseCost = () => S.upgrades.schulung ? 250 : 500;
function train(wid, k) { // Schulung: час в комнате отдыха с наставником, навык +1 (+1,5 с учебным центром)
  const w = S.workers.find(x => x.id === wid);
  if (!w || w.away || !onShift(w) || S.money < courseCost() || w.skills[k] >= 10 || (w.job && ['train', 'strike', 'home'].includes(w.job.type))) return false;
  pay(courseCost(), 'training'); interrupt(w);
  const seat = SEATS.find(s => !S.workers.some(o => o.seat === s)) || SEATS[0]; w.seat = seat;
  w.job = { type: 'train', work: k, gain: S.upgrades.schulung ? 1.5 : 1, steps: [{ go: { x: seat[0], y: seat[1] } }, { train: 60 }], i: 0 };
  log(`📚 ${w.name}: Schulung «${WORK_RU[k]}» (1 ч, ${eur(courseCost())}).`, 'info'); return true;
}
const moraleBase = () => 60 + (S.upgrades.pausenraum ? 10 : 0) + (S.upgrades.hebehilfe ? 5 : 0) + (S.level - 1) * 2;
function praemie() { // премия команде: раз в сутки, 80 € на человека
  const c = S.workers.length * 80; if (S.t - S.lastPraemie < 1440 || S.money < c) return false;
  pay(c, 'wages'); S.lastPraemie = S.t; addMorale(12); log(`💶 Премия команде: ${eur(c)}, настроение +12.`, 'good'); return true;
}

const RES_BY = Object.fromEntries(RESEARCH.map(r => [r.id, r]));
const resDone = id => S.res.done.includes(id);
const resPlanned = id => resDone(id) || S.res.cur === id || S.res.queue.includes(id);
const resOpen = r => S.level >= (r.lvl || 1) && r.req.every(resDone);
const rpRate = () => RD[S.res.rd].rp + 2 * masters(); // ОИ в сутки без учёта шин
function addRP(v) { if (S.res.cur) S.res.prog += v; else S.res.bank = Math.min(100, S.res.bank + v); }
function research(id) { // выбрать проект или поставить в очередь (можно и после ещё не изученных предпосылок из очереди)
  const r = RES_BY[id]; if (!r || resPlanned(id) || S.level < (r.lvl || 1) || !r.req.every(resPlanned)) return false;
  if (!S.res.cur && resOpen(r)) { S.res.cur = id; S.res.prog = 0; log(`🔬 Исследование: ${r.ru} (${r.rp} ОИ).`, 'info'); } else S.res.queue.push(id);
  return true;
}
function unresearch(id) { if (S.res.cur === id) { S.res.bank = Math.min(100, S.res.bank + S.res.prog * 0.5); S.res.cur = null; S.res.prog = 0; } S.res.queue = S.res.queue.filter(q => q !== id && RES_BY[q].req.every(resPlanned)); nextResearch(); }
function nextResearch() {
  if (S.res.cur) return; const i = S.res.queue.findIndex(q => resOpen(RES_BY[q])); if (i < 0) return;
  S.res.cur = S.res.queue.splice(i, 1)[0]; S.res.prog = 0; log(`🔬 Исследование: ${RES_BY[S.res.cur].ru}.`, 'info');
}
function updateResearch(dt) {
  const rd = RD[S.res.rd]; if (rd.eur) pay(rd.eur * dt / 1440, 'research');
  addRP(rpRate() * dt / 1440);
  if (!S.res.cur) return;
  const d = Math.min(S.res.bank, 60 * dt / 1440); S.res.bank -= d; S.res.prog += d;
  const r = RES_BY[S.res.cur]; if (S.res.prog < r.rp) return;
  S.res.done.push(r.id); S.res.cur = null; S.res.bank = Math.min(100, S.res.bank + S.res.prog - r.rp); S.res.prog = 0; r.apply(); S.xp += 20;
  log(`🔬 Исследовано: ${r.ru} (${r.de}). ${r.fx}`, 'good');
  fireEvent('resdone', { title: `Исследовано: ${r.ru}`, text: r.fx });
  nextResearch();
}

// ================= Навыки: перки мастеров и черты характера =================

// На 8,5 открывается перк «Profi», на 9,5 — «Meister».
const P1 = 8.5, P2 = 9.5;
const tier = (w, k) => !w.skills[k] ? 0 : w.skills[k] >= P2 ? 2 : w.skills[k] >= P1 ? 1 : 0;
const PERKS = {
  transport: [['Staplerprofi', 'погрузчик едет на 15 % быстрее'], ['Logistik-Meister', 'ходит на 10 % быстрее']],

  belegen: [['Gleichmäßige Wicklung', 'брака на намотке на 30 % меньше'], ['Wickel-Meister', 'намотка на 15 % быстрее']],
  vulkan: [['Kranführer', 'кран на 30 % быстрее'], ['Heiz-Meister', 'закрывает пресс вдвое быстрее']],
  nacharbeit: [['Feinschliff', 'на обрезке исправляет на 10 % больше дефектов'], ['Kontroll-Meister', 'финальный контроль ловит на 10 % больше брака и на 15 % быстрее']],
  technik: [['Schnelle Diagnose', 'чинит на 20 % быстрее'], ['Instandhaltungs-Meister', 'после ремонта станок чистый, запчасти на 30 % дешевле']],
};
const RANKS = [[9.5, 'Meister'], [8.5, 'Profi'], [6, 'Facharbeiter'], [3, 'Helfer'], [0, 'Azubi']];
const rankOf = w => { const m = Math.max(...WORKS.map(k => w.skills[k] || 0)); return { lvl: Math.floor(m), name: RANKS.find(r => m >= r[0])[1] }; };
const learnF = w => (w.learn || 1) * S.learnMul * (w.trait === 'lernfreudig' ? 1.5 : 1);
const fatigue = w => heat() * (w.trait === 'robust' ? 0.75 : 1) * (w.shift === 'N' ? 1.15 : 1); // ночью устают быстрее
// Брак на участке: исследования, перки, черта характера
function defMul(w, s) {
  const k = s.work, p = tier(w, k);
  return S.defMul * (S.defG[s.g] || 1) * (k === 'rauen' && p >= 2 ? 0.7 : 1) * ((k === 'reparatur' || k === 'belegen') && p >= 1 ? 0.7 : 1)
    * (w.trait === 'sorgfaeltig' ? 0.7 : w.trait === 'flink' ? 1.2 : 1) * (w.shift === 'N' ? 1.1 : 1);
}

// ================= Кредит и ночь =================
// ================= Бизнес: банк, счета клиентов, страховка, налоги, отчёт =================
// Кредиты гасятся каждый день равными долями (Tilgung) + проценты на остаток. Ставка зависит от репутации (Bonität).
const LOAN_TYPES = [
  { id: 'kfw', de: 'KfW-Gründerkredit', ru: 'льготный кредит для стартапа, один раз', amt: 50000, days: 40, rate: 0.0004, maxLvl: 2, once: true },
  { id: 'bmk', de: 'Betriebsmittelkredit', ru: 'кредит на оборотные средства', amt: 25000, days: 20, rate: 0.001 },
  { id: 'inv', de: 'Investitionskredit', ru: 'инвестиционный кредит на оборудование', amt: 100000, days: 60, rate: 0.0006, lvl: 3 },
];
const LOAN_MAX = [60000, 90000, 160000, 250000, 400000]; // кредитный лимит по уровню компании
const debt = () => S.loans.reduce((a, l) => a + l.left, 0);
const loanRate = p => p.rate * (1.3 - S.rep / 200);
const loanLock = p => (p.lvl || 1) > S.level ? `с уровня ${p.lvl}` : p.maxLvl && S.level > p.maxLvl ? 'только для стартапа' : p.once && S.loanUsed[p.id] ? 'уже получен' : debt() + p.amt > LOAN_MAX[S.level - 1] ? `лимит ${eur(LOAN_MAX[S.level - 1])}` : '';
function takeLoan(id = 'bmk') {
  const p = LOAN_TYPES.find(x => x.id === id); if (!p || loanLock(p)) return false;
  const l = { id: p.id, de: p.de, amt: p.amt, left: p.amt, rate: loanRate(p), per: Math.round(p.amt / p.days) };
  S.loans.push(l); S.loanUsed[p.id] = true; S.money += p.amt; S.stats.loanIn += p.amt;
  log(`🏦 ${p.de}: +${eur(p.amt)} на ${p.days} дн., ${(l.rate * 100).toFixed(3)} % в сутки, погашение ${eur(l.per)} в день.`, 'info'); return true;
}
function repayLoan(i = 0) { // досрочно (Sondertilgung): остаток + 1 % комиссии
  const l = S.loans[i]; if (!l) return false; const fee = Math.round(l.left * 0.01); if (S.money < l.left + fee) return false;
  S.money -= l.left + fee; S.stats.loanOut += l.left; S.stats.interest += fee; S.loans.splice(i, 1);
  log(`🏦 ${l.de} погашен досрочно, комиссия ${eur(fee)}.`, 'good'); return true;
}
// Счета: выручка записывается при отгрузке, а деньги приходят через 1–2 суток. Factoring — сразу, но с комиссией.
const factorFee = () => resDone('controlling') ? 0.015 : 0.03;
function invoice(amt, o) { amt = Math.round(amt);
  if (S.factoring) { const fee = Math.round(amt * factorFee()); S.money += amt - fee; S.stats.receipts += amt; S.stats.interest += fee; return; }
  S.recv.push({ amt, c: o.customer, due: S.t + (resDone('controlling') ? 1 : RI(1, 2)) * 1440 });
}
function collect() { for (let i = S.recv.length - 1; i >= 0; i--) if (S.t >= S.recv[i].due) { S.money += S.recv[i].amt; S.stats.receipts += S.recv[i].amt; S.recv.splice(i, 1); } }
const recvSum = () => S.recv.reduce((a, r) => a + r.amt, 0);

  level: () => ({ level: S.level, name: LEVELS[S.level - 1].de, xp: S.xp, rep: S.rep, next: LEVELS[S.level] || null }),
  goals: () => S.goals.map(g => { const G = GOAL_BY[g.id], [v, m] = G.p(g); return `${G.t}: ${Math.round(v)}/${m}`; }), goalsDone: () => S.goalsDone,
  RESEARCH, research, unresearch, setRD: i => { S.res.rd = i; },
  hireCand, train, fire, praemie, takeLoan, repayLoan, skipNight, tier, rankOf, setShiftModel, negotiate, debt,
  finance: () => { const t = statDiff(S.stats, S.snap); return { cash: Math.round(S.money), debt: debt(), receivables: recvSum(), lossCarry: S.lossCarry, days: S.days.map(r => ({ d: r.d, done: r.done, revenue: Math.round(r.revenue), ebt: Math.round(ebt(r)), tax: r.tax, cash: r.cash })), todayEbt: Math.round(ebt(t)) }; },
  profile: (min = 240) => profile(min),
  draw: (t = tab) => { setTab(t); if (S.gfx === 'pixel' && window.PixelGfx) window.PixelGfx.render(VIEW); else render(); renderTop(); renderSel(); renderPanel(); return $('panel').innerHTML.length; }, // один кадр и панель — для тестов
};
// Профилировщик: сколько мс уходит на части симуляции за min игровых минут
function profile(min) {
  const T = {}, wrap = (n, f) => function (...a) { const t0 = performance.now(); try { return f.apply(this, a); } finally { T[n] = (T[n] || 0) + performance.now() - t0; } };
  const o = { genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker };
  genJobs = wrap('genJobs', o.genJobs); findPath = wrap('findPath', o.findPath); updateHooks = wrap('updateHooks', o.updateHooks); assignJobs = wrap('assignJobs', o.assignJobs);
  updateRobots = wrap('updateRobots', o.updateRobots); checkOrders = wrap('checkOrders', o.checkOrders); updateTrucks = wrap('updateTrucks', o.updateTrucks); updateEvents = wrap('updateEvents', o.updateEvents);
  updateGoals = wrap('updateGoals', o.updateGoals); updateResearch = wrap('updateResearch', o.updateResearch); updateWorker = wrap('updateWorker', o.updateWorker);
  const t0 = performance.now(); advance(min); const tot = performance.now() - t0;
  ({ genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker } = o);
  return { totalMs: Math.round(tot), msPerGameHour: +(tot / min * 60).toFixed(2), parts: Object.fromEntries(Object.entries(T).map(([k, v]) => [k, Math.round(v)])) };
}
})();
