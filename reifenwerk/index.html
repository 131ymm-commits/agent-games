<style>

    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; }

  #topbar .stat b { font-variant-numeric: tabular-nums; }
  .speed button { min-width: 38px; }

  button.on { background: var(--accent); color: #1f2430; border-color: #d88a1e; }
  #wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  /* Смартфон и узкие окна: карта сверху, панель снизу, вкладки листаются, кнопки крупнее */
  @media (max-width: 900px) {

    #topbar button, #panel button, #sel button, #evbar button { min-height: 34px; min-width: 36px; }

    #tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; }
    #sel { min-height: 0; max-height: 15vh; overflow-y: auto; padding: 6px 10px; }

  }
</style>

<script>
'use strict';
(() => {
// ================= Константы =================
const TILE = 24, MW = 76, MH = 52;
const MIN_PER_SEC = 0.75;     // игровых минут в реальную секунду на скорости 1×
const WALK = 18;              // клеток за игровую минуту (клетка ≈ 1,5 м, ≈ 0,45 м/с с учётом манёвров)
const TRUCK_SPEED = 9;
const DAY_START = 6 * 60, SHIFT_CHANGE = 14 * 60, DAY_END = 22 * 60;
const WAGE_PER_HOUR = 21, OVERHEAD_PER_DAY = 2800;
const FORK = 6;                                   // шин на вилах погрузчика за рейс
const CART = 4;                                   // шин на тележке (Rollwagen)
const liftTime = (j, what, w) => (j.crane === what ? 1.5 * (tier(w, 'vulkan') >= 1 ? 0.7 : 1) : j.fork || j.cart ? 0.8 : 0.5) * S.liftMul; // подъёмники (Hebehilfe), Lean, перк «Kranführer»
const DUSTY = ["rauen", "ausschl", "entgr"];       // участки, где сыплется резиновая пыль и стружка
const BREAK_MIN = 5000;                           // средняя наработка на отказ, минут работы (пыль и износ ускоряют); было 1000 — поломок было слишком много (цель — 1–3 в сутки)
// Типичные поломки по участкам: немецкое название — что случилось
const FAULTS = {
  pruef: [['Spreizer-Hydraulik undicht', 'течёт гидравлика расширителя бортов'], ['Prüflampe defekt', 'перегорела лампа осмотра']],
  rauen: [['Raspelmesser stumpf', 'затупились ножи рашпиля'], ['Antriebsriemen gerissen', 'порвался приводной ремень'], ['Felgenspanner klemmt', 'заело зажим обода']],
  ausschl: [['Druckluftschlauch geplatzt', 'лопнул шланг сжатого воздуха'], ['Schleifer defekt', 'сломалась пневмошлифовка']],
  spray: [['Sprühdüse verstopft', 'засорилась форсунка'], ['Absaugung ausgefallen', 'отказала вытяжка']],
  fuellen: [['Extruder-Heizung defekt', 'не греет пистолет-экструдер'], ['Schnecke blockiert', 'заклинило шнек экструдера']],
  pflaster: [['Spreizer-Pneumatik undicht', 'течёт пневматика расширителя'], ['Andrückpresse klemmt', 'заело пресс прижима пластыря']],
  aufbau: [['Extruder der Wickelmaschine verstopft', 'забился экструдер намоточной машины'], ['Wickeltrommel klemmt', 'заело барабан намотки']],
  presse: [['Heizbalg undicht', 'течёт варочная камера (Heizbalg)'], ['Dampfventil klemmt', 'заело паровой клапан'], ['Formsegment klemmt', 'заело сегмент пресс-формы']],
  scan: [['Scanner defekt', 'сломался сканер штрихкодов']],
  entgr: [['Entgratmesser stumpf', 'затупился нож обрезного станка'], ['Drehteller klemmt', 'заело вращение станка']],
  endk: [['Prüfmaschine Fehler', 'ошибка машины финального контроля'], ['Etikettendrucker defekt', 'сломался принтер этикеток']],
  antrieb: [['Kette gesprungen', 'соскочила цепь конвейера'], ['Antriebsmotor überhitzt', 'перегрелся мотор привода']],
};

// ================= Случайность (воспроизводимая) =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search);
const rnd = mulberry32(Number(params.get('seed')) || 20261015);
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ================= Язык: русский / немецкий =================
// ?lang=de|ru → выбор кнопкой RU/DE (localStorage) → язык браузера (de* — немецкий, иначе русский). Как в Bäckerei: параметр не запоминается.
const LANG0 = (() => { const q = params.get('lang'); if (q === 'de' || q === 'ru') return q; try { const s = localStorage.getItem('rw-lang'); if (s === 'de' || s === 'ru') return s; } catch (e) { /* без хранилища */ } return (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'ru'; })();
// L — строка на текущем языке (для того, что перерисовывается); LL — двуязычный текст, который хранится (журнал, события):
// он сам превращается в строку текущего языка в шаблонах `${…}`, String() и JSON — после переключения языка всё перерисуется на новом.
const L = (ru, de) => (S.lang === 'de' ? de : ru);
class Tx { constructor(ru, de) { this.ru = String(ru); this.de = String(de); } toString() { return S.lang === 'de' ? this.de : this.ru; } valueOf() { return this.toString(); } toJSON() { return this.toString(); } }
const LL = (ru, de) => new Tx(ru, de);
const inLang = (x, lg) => x instanceof Tx ? x[lg] : x == null ? '' : String(x);
const TXF = f => new Tx(f('ru'), f('de'));                       // f(lg) строит строку на языке lg
const qq = (s, lg) => lg === 'de' ? `„${s}“` : `«${s}»`;           // кавычки по-русски и по-немецки

// ================= Карта =================
// Планировка по эталонному цеху (plant/README.md): 1 клетка ≈ 1,5 м.
// Длинная ось корпуса — слева (юго-запад) направо (северо-восток); сверху улица и двор, снизу зона Ф.
const T_GRASS = 0, T_ROAD = 1, T_YARD = 2, T_FLOOR = 3, T_WALL = 4, T_DOOR = 5;
const grid = new Uint8Array(MW * MH), blocked = new Uint8Array(MW * MH);
const I = (x, y) => y * MW + x;
const area = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[I(x, y)] = t; };
const wallH = (y, x0, x1) => area(x0, y, x1, y, T_WALL), wallV = (x, y0, y1) => area(x, y0, x, y1, T_WALL);
area(0, 0, MW - 1, MH - 1, T_YARD);
area(0, 0, MW - 1, 2, T_ROAD);                                   // улица
area(0, 50, MW - 1, MH - 1, T_GRASS); area(72, 3, MW - 1, 12, T_GRASS); area(0, 43, 1, 49, T_GRASS);
area(2, 9, 25, 26, T_FLOOR);                                     // К1 — навес без стен
area(2, 27, 26, 42, T_FLOOR); wallH(27, 2, 26); wallV(2, 27, 42); wallH(42, 2, 26);   // К2 — склад материалов
area(26, 9, 66, 49, T_FLOOR); wallH(9, 26, 66); wallH(49, 26, 66); wallV(26, 9, 49); wallV(66, 9, 49); // главный корпус
area(66, 23, 71, 31, T_FLOOR); wallH(23, 66, 71); wallH(31, 66, 71); wallV(71, 23, 31);              // Р — пандус отгрузки
wallH(16, 26, 35); wallV(35, 9, 23); wallH(23, 26, 66); wallH(40, 26, 66);           // С1|С2, С|С3, левый пролёт|Ж, Ж|Ф
area(66, 24, 66, 30, T_FLOOR);                                   // Ж4 открыт на пандус
for (const [x, y] of [[30, 9], [26, 19], [26, 38], [12, 27], [23, 42], [30, 16], [35, 12], [35, 19], [27, 23], [41, 23], [42, 23], [49, 23],
  [60, 23], [61, 23], [37, 23], [29, 40], [53, 40], [67, 23], [68, 23], [69, 23], [70, 23]]) grid[I(x, y)] = T_DOOR;

const ZONES = [
  { name: 'Pausenraum', kind: 'rest', x: 27, y: 10, w: 8, h: 6, color: 'rgba(110,160,110,.28)' },
  { name: 'Parkplatz', kind: 'parking', x: 38, y: 4, w: 24, h: 4, color: 'rgba(80,80,80,.35)' },
  { name: 'К1 VORDACH', kind: 'shed', x: 2, y: 9, w: 24, h: 18, color: 'rgba(150,140,120,.18)' },
  { name: 'К2 MATERIAL', kind: 'label', x: 3, y: 28, w: 23, h: 14, color: 'rgba(120,110,90,.10)' },
  { name: 'С2 PRÜFUNG', kind: 'label', x: 27, y: 17, w: 8, h: 6, color: 'rgba(90,130,200,.10)' },
  { name: 'С3 KARKASSENLAGER', kind: 'label', x: 36, y: 10, w: 30, h: 13, color: 'rgba(90,130,200,.10)' },
  { name: 'Ж1 VORBEREITUNG', kind: 'label', x: 27, y: 24, w: 12, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж2 AUFBAU', kind: 'label', x: 39, y: 24, w: 8, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ж3 PRESSEN', kind: 'label', x: 47, y: 24, w: 7, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж4 FINISH', kind: 'label', x: 54, y: 24, w: 12, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ф KLEINREIFEN', kind: 'label', x: 27, y: 41, w: 39, h: 8, color: 'rgba(150,110,200,.12)' },
];
const DECOR = [

    if (st.act === 'sweep' && j.st) j.st.dirt = Math.max(0, j.st.dirt - 0.25 * dt * (cleanupOn() ? 2 : 1));
    if (st.t >= st.wait || (st.until && S.t >= st.until)) { w.act = null; j.i++; } // until — до конца события (забастовка)
  } else if (st.train) { // Schulung в Pausenraum: через час навык выше
    w.state = 'act'; w.act = 'train'; st.t = (st.t || 0) + dt;
    if (st.t >= st.train) { gainSkill(w, j.work, j.gain); w.act = null; w.seat = null; log(LL(`📚 ${w.name}: Schulung «${WORK_RU[j.work]}» пройдена, навык ${w.skills[j.work].toFixed(1)}.`, `📚 ${w.name}: Schulung „${WORK_DE[j.work]}“ abgeschlossen, Fähigkeit ${w.skills[j.work].toFixed(1).replace('.', ',')}.`), 'good'); j.i++; }
  } else if (st.work) {
    w.state = 'work'; const s = j.st;
    if (j.type === 'start' ? pressDown() : noPower()) { releaseJob(w); return; } // Stromausfall: работа встаёт
    if (!st.grab) { st.grab = 0; }
    if (st.grab < S.grabT && !s.cur && j.type !== 'start') { st.grab += dt; w.act = 'grab'; return; } // взять инструмент
    w.act = null;
    if (j.type === 'start') {
      const T0 = (s.startT || 10) * (tier(w, 'vulkan') >= 2 ? 0.5 : 1); st.t = (st.t || 0) + dt; s.prog = st.t / T0;
      if (st.t >= T0) { s.state = 'running'; s.timer = cureTime(s); s.worker = null; s.prog = 0; scanTire(s, s.items[0], null); j.i++; }
    } else {
      if (!s.cur) {
        const k = firstIdx(s.input, id => S.tires.get(id).readyAt <= S.t); // шина после клея должна высохнуть; Eilauftrag — первой
        if (k < 0 || !matsOk(s)) { releaseJob(w); return; }
        s.cur = s.input.splice(k, 1)[0]; matTake(s, 1);
        st.dur = workDuration(w, s) + (s.g === 'fuellen' && S.tires.get(s.cur).edge ? 2 : 0); st.t = 0;
      }
      st.t += dt; s.prog = st.t / st.dur; s.busy += dt; s.wear = Math.min(2, s.wear + dt / 900 * S.wearMul);
      if (rnd() < dt * breakRate(s)) { breakDown(s); return; }
      if (st.t >= st.dur) { finishProc(s, w); j.i++; }
    }
    w.energy = Math.max(0, w.energy - 0.06 * dt * fatigue(w) * S.workFatigue);
  } else if (st.rest) {
    w.state = 'break'; w.energy = Math.min(100, w.energy + 1.2 * dt * S.restMul);
    if (w.energy >= 96) { w.seat = null; j.i++; }
  } else if (st.leave) { w.away = true; w.state = 'home'; w.job = null; w.x = EXIT.x; w.y = EXIT.y; return; }
  if (j.i >= j.steps.length) { w.job = null; w.state = 'idle'; }
}

function updateRobots(dt) {
  for (const s of GROUP.aufbau) {
    if (!s.robot || s.broken || noPower()) continue;
    if (!s.cur) {
      const k = firstIdx(s.input, id => S.tires.get(id).readyAt <= S.t);
      if (k < 0 || s.out.length >= s.outCap || !matsOk(s)) continue;
      s.cur = s.input.splice(k, 1)[0]; matTake(s, 1); s.rT = 0; s.rDur = s.time * 0.9 * S.tMul.aufbau * prodOf(s.cur).time;
    }
    s.rT += dt; s.prog = s.rT / s.rDur; s.busy += dt; s.wear = Math.min(2, s.wear + dt / 900 * S.wearMul);
    if (rnd() < dt * breakRate(s)) { breakDown(s); continue; }
    if (s.rT >= s.rDur) finishProc(s, ROBOT);
  }
  if (S.rollenbahn) for (const s of GROUP.aufbau) for (let i = s.out.length - 1; i >= 0; i--) {

    if (S.t >= t.rollT && canAcceptId('puffer')) { const tid = s.out.splice(i, 1)[0]; delete t.rollT; t.res = false; ST.puffer.items.push(tid); }
  }

  if (S.upgrades.ladeportal && !pressDown() && S.t >= (S.portalT || 0)) for (const p of GROUP.presse) {
    if (p.broken || p.worker || p.resIn) continue;
    if (p.state === 'done') {

      p.items.splice(p.items.indexOf(tid), 1); p.state = 'idle'; ST[dst].input.push(tid); S.portalT = S.t + 1.5; break;
    }
    if (p.state !== 'idle') continue;
    if (p.items.length < p.cap) {
      const tid = rushFirst(ST.puffer.items.filter(id => !S.tires.get(id).res))[0]; if (!tid) continue;
      ST.puffer.items.splice(ST.puffer.items.indexOf(tid), 1); p.items.push(tid); p.lastLoad = S.t;
    }
    if (p.items.length >= p.cap) { p.state = 'running'; p.timer = cureTime(p) + 2; scanTire(p, p.items[0], null); S.portalT = S.t + 1.5; break; }
  }
}

  const dur = def.make(e); if (dur === false) return null; Object.assign(e, opt); // make вернул false — событию сейчас не из чего случиться
  if (e.choices) { e.state = 'choice'; e.until = S.t + (def.wait || 240); if (e.def === undefined) e.def = e.choices.length - 1; }

function updateGoals() {
  for (const g of S.goals.slice()) { const G = GOAL_BY[g.id], [v, m] = G.p(g); if (v >= m) completeGoal(g, G); }
  while (S.goals.length < 3) {
    const G = GOALS.find(G => G.lvl <= S.level && !S.goalsDone.includes(G.id) && !S.goals.some(g => g.id === G.id)); if (!G) break;
    S.goals.push({ id: G.id, start: S.t, base: G.base ? G.base() : 0 });
  }
}
function completeGoal(g, G) {
  S.goals.splice(S.goals.indexOf(g), 1); S.goalsDone.push(G.id);
  const r = G.r; if (r.money) bonus(r.money); if (r.xp) S.xp += r.xp; if (r.rep) addRep(r.rep); if (r.morale) addMorale(r.morale);
  log(LL(`🏆 Цель выполнена: ${G.t}. Награда: ${rewardText(r, 'ru')}.`, `🏆 Ziel erreicht: ${G.tDe}. Belohnung: ${rewardText(r, 'de')}.`), 'good');
  fireEvent('goal', { title: LL(`Цель выполнена: ${G.t}`, `Ziel erreicht: ${G.tDe}`), text: LL(`Награда: ${rewardText(r, 'ru')}.`, `Belohnung: ${rewardText(r, 'de')}.`) });
}

// ================= Люди: найм, обучение, настроение =================
const shiftForNew = () => activeShifts().map(k => [k, S.workers.filter(x => x.shift === k && !x.temp).length]).sort((a, b) => a[1] - b[1])[0][0];
// Модель смен: при смене модели люди перераспределяются по сменам (в каждой — все профессии). Ночная смена — с уровня 2.
function setShiftModel(n) {
  if (n === S.shiftModel || n < 1 || n > 3 || (n === 3 && S.level < 2)) return false;
  const was = S.shiftModel; S.shiftModel = n; PLAN.T = n * 480;
  const sh = activeShifts(), best = w => WORKS.reduce((a, k) => w.skills[k] > w.skills[a] ? k : a, 'transport');
  S.workers.filter(w => !w.temp).sort((a, b) => best(a).localeCompare(best(b)) || b.skills[best(b)] - a.skills[best(a)]).forEach((w, i) => { w.shift = sh[i % sh.length]; });
  for (const w of S.workers) if (w.temp && !sh.includes(w.shift)) w.shift = sh[0];
  addMorale(-5); // Betriebsrat: перестройка графика никому не нравится
  const dist = sh.map(k => `${k} — ${S.workers.filter(w => w.shift === k).length}`).join(', ');
  log(LL(`🕐 Модель смен: ${n} ${n === 1 ? 'смена' : 'смены'} (было ${was}). Люди распределены: ${dist}.${n === 3 ? ' Ночная смена получает +25 % (Nachtzuschlag).' : ''}`,
    `🕐 Schichtmodell: ${n} ${n === 1 ? 'Schicht' : 'Schichten'} (vorher ${was}). Neue Verteilung: ${dist}.${n === 3 ? ' Die Nachtschicht bekommt +25 % (Nachtzuschlag).' : ''}`), 'info');
  return true;
}
// Срок в рабочих минутах при нынешней модели смен (+1 ч на отгрузку)
function workDeadline(min) { let t = S.t, left = min; while (left > 0 && t < S.t + 10 * 1440) { if (workingAt(((t % 1440) + 1440) % 1440)) left -= 15; t += 15; } return t + 60; }
// Кандидаты (Bewerber) обновляются каждое утро; чем выше уровень компании, тем сильнее кандидаты
function makeCands() {
  const top = [7, 8, 9, 9, 9][S.level - 1];
  S.cands = Array.from({ length: 3 }, () => {
    const k = pick(WORKS), k2 = pick(WORKS.filter(x => x !== k)), a = RI(top - 3, top), b = RI(3, Math.min(7, a));
    return { id: S.nextId++, name: pick(FIRST) + ' ' + pick(LAST), k, a, k2, b, wage: Math.round((14 + a * 0.8 + b * 0.3) * 2) / 2, fee: 300 + a * 50 };
  });
}
function hireCand(id) {
  const c = S.cands.find(x => x.id === id); if (!c || S.money < c.fee) return false;
  pay(c.fee, 'hiring'); const w = makeWorker(c.name, ROLE[c.k], shiftForNew(), { [c.k]: c.a, [c.k2]: c.b }); w.wage = c.wage; S.workers.push(w);
  S.cands = S.cands.filter(x => x !== c);
  log(LL(`Нанят ${w.name}: ${ROLE[c.k]}, ${WORK_RU[c.k]} ${c.a}, ${w.wage} €/ч (${SHIFTS[w.shift].de}).`, `Eingestellt: ${w.name}, ${ROLE[c.k]}, ${WORK_DE[c.k]} ${c.a}, ${w.wage} €/h (${SHIFTS[w.shift].de}).`), 'good'); return w;
}
function hire() { if (!S.cands.length) makeCands(); return hireCand(S.cands[0].id); }
function addTemp(src) { // Leiharbeiter из Zeitarbeit на время больничного
  const t = makeWorker(pick(FIRST) + ' ' + pick(LAST), 'Leiharbeiter', src.shift, {});
  for (const k of WORKS) t.skills[k] = Math.max(2, src.skills[k] - 2);
  Object.assign(t, { prio: { ...src.prio }, wage: 32, temp: true, leaveAt: src.sickUntil }); S.workers.push(t); return t;
}
function interrupt(w) { releaseJob(w); w.seat = null; }
function removeWorker(w) { if (w.job) interrupt(w); S.workers.splice(S.workers.indexOf(w), 1); if (S.selected && S.selected.w === w) S.selected = null; }
function fire(wid) { // увольнение: выходное пособие (Abfindung) — 5 смен
  const w = S.workers.find(x => x.id === wid); if (!w) return false;
  const sev = w.temp ? 0 : Math.round(w.wage * 8 * 5); pay(sev, 'hiring'); removeWorker(w); if (!w.temp) addMorale(-5);
  log(LL(`${w.name} уволен(а)${sev ? `, Abfindung ${eur(sev)}` : ''}. Настроение команды −5.`, `${w.name} wurde entlassen${sev ? `, Abfindung ${eur(sev)}` : ''}. Stimmung im Team −5.`), 'warn'); return true;
}
const courseCost = () => S.upgrades.schulung ? 250 : 500;
function train(wid, k) { // Schulung: час в комнате отдыха с наставником, навык +1 (+1,5 с учебным центром)
  const w = S.workers.find(x => x.id === wid);
  if (!w || w.away || !onShift(w) || S.money < courseCost() || w.skills[k] >= 10 || (w.job && ['train', 'strike', 'home'].includes(w.job.type))) return false;
  pay(courseCost(), 'training'); interrupt(w);
  const seat = SEATS.find(s => !S.workers.some(o => o.seat === s)) || SEATS[0]; w.seat = seat;
  w.job = { type: 'train', work: k, gain: S.upgrades.schulung ? 1.5 : 1, steps: [{ go: { x: seat[0], y: seat[1] } }, { train: 60 }], i: 0 };
  log(LL(`📚 ${w.name}: Schulung «${WORK_RU[k]}» (1 ч, ${eur(courseCost())}).`, `📚 ${w.name}: Schulung „${WORK_DE[k]}“ (1 h, ${eur(courseCost())}).`), 'info'); return true;
}
const moraleBase = () => 60 + (S.upgrades.pausenraum ? 10 : 0) + (S.upgrades.hebehilfe ? 5 : 0) + (S.level - 1) * 2;
function praemie() { // премия команде: раз в сутки, 80 € на человека
  const c = S.workers.length * 80; if (S.t - S.lastPraemie < 1440 || S.money < c) return false;

}

  document.querySelectorAll('#tabs button').forEach(b => { const t = tabs[b.dataset.tab]; if (!t) return; const tl = b.querySelector('.tl'); if (tl) tl.textContent = L(t[0], t[1]); else b.textContent = L(t[0], t[1]); });
  $('langBtn').textContent = S.lang === 'de' ? 'RU' : 'DE'; $('langBtn').title = L('Deutsch — переключить язык', 'Русский — Sprache wechseln');
  $('tutBtn').innerHTML = '❓<span class="gl"> ' + L('Обучение', 'Anleitung') + '</span>'; $('tutBtn').title = L('Показать обучение ещё раз', 'Anleitung noch einmal zeigen');

}

// ================= Главный цикл =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.speed > 0) { if (S.autoNight && !working() && !S.events.some(e => e.state === 'choice')) skipNight(); else advance(dt * MIN_PER_SEC * S.speed); }
  if (pixelOn()) { window.PixelGfx.render(VIEW); pixDrawn = true; if (tutCam) { tutFocus(tutCam); tutCam = null; } } else render();
  drawTutArea();
  uiT += dt; if (uiT > 0.3) { uiT = 0; renderTop(); if (!uiBusy('#sel')) renderSel(); if (!uiBusy('#panel') || tab === 'log') renderPanel(); }
  requestAnimationFrame(frame);
}
// Старт: цех уже работает — два заказа в производстве, шины на участках, автоклав греет, едет грузовик
function prefill() {
  const order = (customer, qty, price, dl, state = 'production') => { const o = { id: S.nextId++, customer, qty, price, deadline: S.t + dl, expires: S.t, state, finished: 0, scrapped: 0, shippedN: 0 }; S.orders.push(o); return o; };
  const tire = (o, stage, bad = 0.04) => { const t = { id: S.nextTire++, order: o.id, badCasing: rnd() < bad, holes: rnd() < 0.35, patched: stage !== 'karkasse' && stage !== 'pruef' && stage !== 'aufh' && stage !== 'rauen', defect: false, rework: 0, stage, readyAt: 0, res: false, dest: null, tIn: S.t - RI(120, 900), trace: [] }; if (stage !== 'karkasse') t.code = 'RW' + String(t.id).padStart(5, '0'); S.tires.set(t.id, t); return t.id; };
  const a = order('Spedition Krause', 36, 205, 1300), b = order('Busbetrieb Schäfer', 20, 215, 1900);
  for (let k = 0; k < 12; k++) { ST.fertig.items.push(tire(a, 'fertig', 0)); a.finished++; } // готово к отгрузке → скоро приедет грузовик
  GROUP.presse.forEach((p, k) => { if (k < 8) { p.items.push(tire(a, 'aufbau')); Object.assign(p, { state: 'running', timer: 8 + k * 10 }); } }); // 8 из 10 прессов греют
  for (let k = 0; k < 4; k++) ST.puffer.items.push(tire(a, 'aufbau'));
  for (let k = 0; k < 4; k++) ST.sort.items.push(tire(a, 'pruef'));
  const PREV = { pruef: 'karkasse', rauen: 'aufh', ausschl: 'rauen', pflaster: 'ausschl', spray: 'ausschl', fuellen: 'spray', aufbau: 'fuellen', entgr: 'presse', endk: 'entgr' };
  for (const [id, o, n] of [['entgr1', a, 3], ['entgr2', a, 1], ['endk', a, 1], ['aufbau1', a, 1], ['aufbau2', a, 1], ['fuellen', a, 1],
    ['spray', b, 1], ['ausschl1', b, 1], ['ausschl2', b, 1], ['pflaster', b, 1], ['rauen1', b, 1], ['rauen2', b, 1], ['pruef1', b, 1], ['pruef2', b, 1]]) {
    for (let k = 0; k < n; k++) ST[id].input.push(tire(o, PREV[ST[id].g], ST[id].g === 'pruef' ? 0.13 : 0.04));
  }
  for (const st of LOOP_ST) if (st.kind === 'proc' && !st.final) for (const tid of st.input) { HOOKS.push({ seg: st.stopSeg, s: st.stopS, tire: null, dest: null, hold: st.id, tid }); hookStock--; }
  for (let k = 0; k < 4; k++) ST.aufh.items.push(tire(b, 'pruef'));
  for (let k = 0; k < 9; k++) ST.eingang.items.push(tire(b, 'karkasse', 0.13));
  const c = order('Kühltransporte Nord', 16, 210, 2400, 'incoming');
  pendingTrucks.push({ kind: 'deliver', order: c, at: S.t + 12 });
  for (const s of [ST.rauen1, ST.ausschl1, ST.entgr2]) s.dirt = 0.3; // с ночи осталась пыль — будет что подметать
}
if (params.get('empty') !== '1') prefill();
makeOffer(); makeOffer(); makeCands(); updateGoals();
resize(); renderTop(); renderSel(); renderPanel();
log(LL('Добро пожаловать в Reifenwerk! Вы — стартап: взяли в аренду цех восстановления шин вместе с командой из 15 человек. Банк даст льготный кредит KfW (вкладка «Финансы»), дальше — развитие, оптимизация, оборудование. Цех построен по эталону: горячий метод — крюки в Ж1–Ж2, намотка сырой резины, 10 прессов с формами, обрезка, сканер, контроль, отгрузка через пандус Р. 2 заказа уже в производстве, грузовик подъезжает к воротам З. Заказы принимаются автоматически (вкладка «Заказы»).',
  'Willkommen im Reifenwerk! Du bist ein Start-up: Du hast ein Runderneuerungswerk samt 15-köpfigem Team gemietet. Die Bank gibt dir einen KfW-Gründerkredit (Reiter „Finanzen“), danach heißt es: wachsen, optimieren, investieren. Das Werk folgt dem Vorbild: Heißverfahren — Hängebahn in Ж1–Ж2, Rohgummi-Wicklung, 10 Heizpressen mit Formen, Entgraten, Scanner, Kontrolle, Versand über die Rampe Р. Zwei Aufträge laufen schon, ein Lkw fährt gerade ans Tor З. Aufträge werden automatisch angenommen (Reiter „Aufträge“).'), 'info');
applyLang();
// Обучение — при первом запуске (флаг в localStorage); ?tut=1 — показать всегда, ?tut=0 — не показывать
{ const tq = params.get('tut'); let seen = false; try { seen = !!localStorage.getItem('rw-tut'); } catch (e) { /* без хранилища */ } if (tq === '1' || (tq !== '0' && !seen)) showTut(0); }
requestAnimationFrame(frame);

// ================= API для автоматической игры и тестов =================
window.RW = {
  S, ST, STATIONS, GROUP, HOOKS, VIEW, advance, acceptOffer, declineOffer, buy, hire, wipCount, setHook, setGfx,
  showTut, applyLang, TUT, setLang: lg => { S.lang = lg === 'de' ? 'de' : 'ru'; try { localStorage.setItem('rw-lang', S.lang); } catch (e) { /* без хранилища */ } applyLang(); if (tut !== null) showTut(tut); return S.lang; },
  setSpeed: v => { S.speed = v; renderTop(); },
  setPrio: (name, work, p) => { const w = S.workers.find(w => w.name.startsWith(name)); if (w) w.prio[work] = p; },
  summary: () => ({
    day: day(), clock: fmtClock(clock()), money: Math.round(S.money), rep: Math.round(S.rep), level: S.level, xp: Math.round(S.xp), morale: Math.round(S.morale), shipped: S.shipped, scrap: S.scrap,
    doneToday: S.doneToday, doneYesterday: S.doneYesterday, leadMin: avgLead(), walkTodayM: Math.round(S.stats.walkToday * 1.5), wip: `${wipCount()}/${S.wip}`, hooksBusy: HOOKS.filter(h => h.tire).length,
    stations: Object.fromEntries(STATIONS.map(s => [s.id, s.kind === 'proc' ? `${s.input.length}>${s.cur ? 1 : 0}>${s.out.length} ${util(s)}%` : s.kind === 'auto' ? `${s.state}:${s.items.length} ${util(s)}%` : String(s.items.length)])),
    workers: S.workers.map(w => `${w.name.split(' ')[0]}(${w.shift}): ${jobText(w)} (${Math.round(w.energy)}%)`),
    offers: S.offers.map(o => `${o.id} ${o.customer} ${o.qty}×${o.price}`),
    orders: S.orders.filter(o => o.state !== 'done').map(o => `${o.customer} ${o.state} ${o.finished}/${o.qty} лом ${o.scrapped}${o.rush ? ' ⚡' : ''}${o.prod && o.prod !== 'lkw' ? ' ' + o.prod : ''}`),
    mats: { ...S.mats }, trucks: S.trucks.map(t => `${t.kind} ${t.state} ${t.cargo.length}`),
    breakdowns: S.stats.breakdowns, broken: MACHINES.filter(m => m.broken).map(m => `${m.id}: ${m.broken.de} ${m.broken.tech ? Math.round(m.broken.done / m.broken.need * 100) + '%' : 'ждёт'}`),
    downtimeMin: Math.round(S.stats.downtime), repairsEur: S.stats.repairs,
    events: S.events.map(e => `${e.kind}:${e.state}`), goals: S.goals.map(g => g.id), research: S.res.cur, researched: S.res.done.length, upgrades: Object.keys(S.upgrades),
  }),
  MACHINES, breakDown, UPGRADES, buyUpgrade,
  // События: список, запустить вручную (с выбором варианта сразу), выбрать вариант
  events: () => S.events.map(e => ({ id: e.id, kind: e.kind, title: e.title, text: e.text, state: e.state, x: e.x, y: e.y, until: e.until, choices: e.choices && e.choices.map(c => c.t) })),
  EVENT_KINDS: Object.keys(EVENTS), eventLog: () => S.eventLog,
  triggerEvent: (kind, choice, force = true) => { const e = fireEvent(kind, {}, force); if (e && choice !== undefined && e.state === 'choice') chooseEvent(e.id, choice); return e && { id: e.id, kind: e.kind, state: e.state, text: e.text, res: e.res }; },
  chooseEvent, fireEvent,
  // Развитие, люди, исследования, кредит, ночь
  level: () => ({ level: S.level, name: LEVELS[S.level - 1].de, xp: S.xp, rep: S.rep, next: LEVELS[S.level] || null }),
  goals: () => S.goals.map(g => { const G = GOAL_BY[g.id], [v, m] = G.p(g); return `${goalT(G)}: ${Math.round(v)}/${m}`; }), goalsDone: () => S.goalsDone,
  RESEARCH, research, unresearch, setRD: i => { S.res.rd = i; },
  hireCand, train, fire, praemie, takeLoan, repayLoan, skipNight, tier, rankOf, setShiftModel, negotiate, debt,
  finance: () => { const t = statDiff(S.stats, S.snap); return { cash: Math.round(S.money), debt: debt(), receivables: recvSum(), lossCarry: S.lossCarry, days: S.days.map(r => ({ d: r.d, done: r.done, revenue: Math.round(r.revenue), ebt: Math.round(ebt(r)), tax: r.tax, cash: r.cash })), todayEbt: Math.round(ebt(t)) }; },
  profile: (min = 240) => profile(min),
  draw: (t = tab) => { setTab(t); if (S.gfx === 'pixel' && window.PixelGfx) { window.PixelGfx.render(VIEW); pixDrawn = true; if (tutCam) { tutFocus(tutCam); tutCam = null; } } else render(); drawTutArea(); renderTop(); renderSel(); renderPanel(); return $('panel').innerHTML.length; }, // один кадр и панель — для тестов
};
// Профилировщик: сколько мс уходит на части симуляции за min игровых минут
function profile(min) {
  const T = {}, wrap = (n, f) => function (...a) { const t0 = performance.now(); try { return f.apply(this, a); } finally { T[n] = (T[n] || 0) + performance.now() - t0; } };
  const o = { genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker };
  genJobs = wrap('genJobs', o.genJobs); findPath = wrap('findPath', o.findPath); updateHooks = wrap('updateHooks', o.updateHooks); assignJobs = wrap('assignJobs', o.assignJobs);
  updateRobots = wrap('updateRobots', o.updateRobots); checkOrders = wrap('checkOrders', o.checkOrders); updateTrucks = wrap('updateTrucks', o.updateTrucks); updateEvents = wrap('updateEvents', o.updateEvents);
  updateGoals = wrap('updateGoals', o.updateGoals); updateResearch = wrap('updateResearch', o.updateResearch); updateWorker = wrap('updateWorker', o.updateWorker);
  const t0 = performance.now(); advance(min); const tot = performance.now() - t0;
  ({ genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker } = o);
  return { totalMs: Math.round(tot), msPerGameHour: +(tot / min * 60).toFixed(2), parts: Object.fromEntries(Object.entries(T).map(([k, v]) => [k, Math.round(v)])) };
}
