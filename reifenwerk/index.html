<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reifenwerk</title>
<style>

  #sel { padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 64px; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }

  #tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); background: transparent; }
  #panel { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--accent); } .info { color: var(--info); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }

  .p1 { background: #2f6b3a; } .p2 { background: #4f6b2f; } .p3 { background: #6b5d2f; } .p4 { background: #6b412f; } .p0 { background: #2a2e37; color: #555; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar { height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); }
  .log div { padding: 2px 0; border-bottom: 1px dashed #30343d; }

  @media (max-width: 900px) { body { flex-direction: column; } #side { width: 100%; height: 45vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>

<script>
'use strict';
(() => {
// ================= Константы =================
const TILE = 24, MW = 48, MH = 30;
const MIN_PER_SEC = 0.75;     // игровых минут в реальную секунду на скорости 1×
const WALK = 12;              // клеток за игровую минуту (клетка ≈ 1,5 м, с шиной ≈ 0,3 м/с)
const TRUCK_SPEED = 9;
const DAY_START = 6 * 60, SHIFT_CHANGE = 14 * 60, DAY_END = 22 * 60;
const WAGE_PER_HOUR = 21, OVERHEAD_PER_DAY = 2800;

// ================= Случайность (воспроизводимая) =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search);
const rnd = mulberry32(Number(params.get('seed')) || 20261015);
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ================= Карта =================
const T_GRASS = 0, T_ROAD = 1, T_YARD = 2, T_FLOOR = 3, T_WALL = 4, T_DOOR = 5;
const grid = new Uint8Array(MW * MH), blocked = new Uint8Array(MW * MH);
const I = (x, y) => y * MW + x;
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
  let t = T_GRASS;
  if (x <= 2) t = T_ROAD; else if (x <= 9 && y >= 1 && y <= 28) t = T_YARD;
  if (x >= 10 && x <= 46 && y >= 2 && y <= 27) t = (x === 10 || x === 46 || y === 2 || y === 27) ? T_WALL : T_FLOOR;
  grid[I(x, y)] = t;
}
for (const [x, y] of [[10, 5], [10, 6], [10, 21], [10, 22], [28, 27], [29, 27]]) grid[I(x, y)] = T_DOOR;

const ZONES = [
  { name: 'Pausenraum', x: 12, y: 9, w: 6, h: 6, color: 'rgba(110,160,110,.28)' },
  { name: 'Büro', x: 20, y: 9, w: 5, h: 4, color: 'rgba(120,130,190,.25)' },
  { name: 'Parkplatz', x: 22, y: 28, w: 14, h: 2, color: 'rgba(80,80,80,.35)' },
];
const DECOR = [
  { id: 'regal', label: 'Materiallager', x: 30, y: 9, w: 5, h: 2, color: '#5b4a3a', desc: 'Стеллажи с материалами: протекторы (Laufstreifen), связующая резина (Bindegummi), клей (Gummilösung), ремонтная резина (Füllgummi). Остатки — во вкладке «Склад».' },
  { id: 'kaffee', label: '☕', x: 17, y: 9, w: 1, h: 1, color: '#6b3f2a', desc: 'Кофемашина. Здесь рабочие восстанавливают силы.' },
  { id: 'tisch', label: '', x: 13, y: 11, w: 3, h: 1, color: '#7a5a3a', desc: 'Стол в комнате отдыха.' },
  { id: 'desk', label: '', x: 21, y: 10, w: 2, h: 1, color: '#5a5f7a', desc: 'Стол мастера: заказы, планирование, качество. Мастер — это вы.' },
  { id: 'schrott', label: 'Schrott', x: 4, y: 13, w: 2, h: 2, color: '#7a3b2a', desc: 'Контейнер для лома. Сюда уходят забракованные каркасы.' },
];
for (const d of DECOR) for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) blocked[I(x, y)] = 1;
const SEATS = [[12, 10], [14, 10], [16, 10], [12, 12], [16, 12], [12, 13], [14, 13], [16, 13], [12, 14], [14, 14], [16, 14]];
const EXIT = { x: 28, y: 29 }, ENTRY = { x: 28, y: 28 };
const SCRAP_ACCESS = { x: 6, y: 14 };
const DOCKS = { 1: { y: 5.5, access: { x: 9, y: 5 } }, 2: { y: 21.5, access: { x: 9, y: 21 } } };

// ================= Станции =================
// g = группа (тип станции). next — группа, куда шина идёт дальше. Станций одной группы может быть несколько.
const WORKS = ['transport', 'pruefen', 'rauen', 'reparatur', 'belegen', 'vulkan', 'nacharbeit', 'lack'];
const WORK_RU = { transport: 'Транспорт', pruefen: 'Контроль', rauen: 'Рауен', reparatur: 'Ремонт', belegen: 'Обкладка', vulkan: 'Вулканизация', nacharbeit: 'Дефекты', lack: 'Покраска' };
const INFO = {
  eingang: ['Eingangslager', 'Склад приёмки', 'Каркасы из грузовика клиента ждут входного контроля.'],
  pruef: ['Eingangsprüfung', 'Входной контроль', 'Осмотр каркаса снаружи и изнутри на расширителе бортов. Порезы корда, разрыв брекера, старость — в лом.'],
  rauen: ['Rauen', 'Снятие протектора', 'Рауавтомат вращающейся фрезой снимает остатки старого протектора до нужного радиуса и шероховатости.'],
  ausschl: ['Ausschleifen', 'Зачистка повреждений', 'Повреждения (гвозди, порезы) высверливают и зачищают до здоровой резины.'],
  spray: ['Flüssiggummi', 'Нанесение жидкой резины', 'На зачищенную поверхность и в выемки наносят жидкую резину (Gummilösung). Шина 15 минут сохнет до липкости.'],
  fuellen: ['Spachteln', 'Шпаклёвка дыр', 'Дыры и выемки зашпаклёвывают ремонтной резиной (Füllgummi) из экструдера и выравнивают. Большие пробои — пластырь изнутри.'],
  belegen: ['Belegen', 'Наложение протектора', 'Слой Bindegummi + готовый протектор (Laufstreifen) по длине окружности. Роликом выдавливают воздух (Anrollen).'],
  huelle: ['Einhüllen', 'Надевание чехла', 'Резиновый чехол (Hülle) и монтажное кольцо, вакуумная проверка герметичности.'],
  auto: ['Autoklav', 'Автоклав', 'Партия до 10 шин, цикл около 5 ч: нагрев, вулканизация при ~110–120 °C под давлением, охлаждение. Связующий слой намертво соединяет протектор с каркасом. Вечером запускают последнюю партию — автоклав работает ночью.'],
  entgr: ['Fehlerbeseitigung', 'Устранение дефектов', 'После автоклава: снять чехол и кольцо, обрезать облой (Entgraten), устранить мелкие дефекты (пузыри, наплывы). Серьёзный брак — на переделку или в лом.'],
  nacharb: ['Nacharbeit', 'Стеллаж переделки', 'Шины с серьёзным дефектом ждут повторной зачистки. Отдельный буфер не даёт линии заклинить по кругу.'],
  lack: ['Lackieren', 'Покраска', 'Покраска боковин восстановленной шины.'],
  endk: ['Endkontrolle', 'Финальный контроль', 'Осмотр, проверка давлением, маркировка ECE R109 «Retread», штрихкод. Что пропустит контроль — уедет к клиенту.'],
  fertig: ['Versand', 'Отправка', 'Проверенные шины ждут грузовик клиента у рампы 2.'],
};
const STATIONS = [
  { id: 'eingang', g: 'eingang', kind: 'store', x: 12, y: 3, w: 4, h: 3, ax: 14, ay: 6, cap: 40, next: 'pruef', color: '#4b5361' },
  { id: 'pruef', g: 'pruef', kind: 'proc', work: 'pruefen', time: 6, x: 17, y: 3, w: 2, h: 2, ax: 17, ay: 5, inCap: 2, next: 'rauen', color: '#2c6aa8' },
  { id: 'rauen1', g: 'rauen', kind: 'proc', work: 'rauen', time: 7, x: 20, y: 3, w: 3, h: 2, ax: 21, ay: 5, inCap: 2, next: 'ausschl', color: '#8f5a1c' },
  { id: 'rauen2', g: 'rauen', kind: 'proc', work: 'rauen', time: 7, x: 23, y: 3, w: 3, h: 2, ax: 24, ay: 5, inCap: 2, next: 'ausschl', color: '#8f5a1c' },
  { id: 'ausschl1', g: 'ausschl', kind: 'proc', work: 'reparatur', time: 8, x: 27, y: 3, w: 2, h: 2, ax: 27, ay: 5, inCap: 2, next: 'spray', color: '#7a4f8a' },
  { id: 'ausschl2', g: 'ausschl', kind: 'proc', work: 'reparatur', time: 8, x: 29, y: 3, w: 2, h: 2, ax: 30, ay: 5, inCap: 2, next: 'spray', color: '#7a4f8a' },
  { id: 'spray', g: 'spray', kind: 'proc', work: 'reparatur', time: 2, dry: 15, mat: { loesung: 1 }, x: 32, y: 3, w: 3, h: 2, ax: 33, ay: 5, inCap: 2, outCap: 4, next: 'fuellen', color: '#3c7f7a' },
  { id: 'fuellen', g: 'fuellen', kind: 'proc', work: 'reparatur', time: 6, mat: { fuellgummi: 1 }, x: 36, y: 3, w: 2, h: 2, ax: 36, ay: 5, inCap: 2, next: 'belegen', color: '#5d6b2f' },
  { id: 'belegen1', g: 'belegen', kind: 'proc', work: 'belegen', time: 9, mat: { laufstreifen: 1, bindegummi: 1 }, x: 39, y: 3, w: 3, h: 2, ax: 40, ay: 5, inCap: 2, next: 'huelle', color: '#a0662a' },
  { id: 'belegen2', g: 'belegen', kind: 'proc', work: 'belegen', time: 9, mat: { laufstreifen: 1, bindegummi: 1 }, x: 42, y: 3, w: 3, h: 2, ax: 43, ay: 5, inCap: 2, next: 'huelle', color: '#a0662a' },
  { id: 'huelle', g: 'huelle', kind: 'proc', work: 'belegen', time: 4, x: 35, y: 7, w: 2, h: 2, ax: 35, ay: 6, inCap: 4, next: 'auto', color: '#4a4f73' },
  { id: 'auto1', g: 'auto', kind: 'auto', work: 'vulkan', x: 40, y: 8, w: 5, h: 3, ax: 45, ay: 9, cap: 10, cycle: 300, next: 'entgr', color: '#56606e' },
  { id: 'auto2', g: 'auto', kind: 'auto', work: 'vulkan', x: 40, y: 11, w: 5, h: 3, ax: 45, ay: 12, cap: 10, cycle: 300, next: 'entgr', color: '#56606e' },
  { id: 'auto3', g: 'auto', kind: 'auto', work: 'vulkan', x: 40, y: 14, w: 5, h: 3, ax: 45, ay: 15, cap: 10, cycle: 300, next: 'entgr', color: '#56606e' },
  { id: 'auto4', g: 'auto', kind: 'auto', work: 'vulkan', x: 40, y: 17, w: 5, h: 3, ax: 45, ay: 18, cap: 10, cycle: 300, next: 'entgr', color: '#56606e' },
  { id: 'entgr1', g: 'entgr', kind: 'proc', work: 'nacharbeit', time: 6, x: 40, y: 22, w: 2, h: 2, ax: 40, ay: 21, inCap: 3, next: 'lack', color: '#8a5a2a' },
  { id: 'entgr2', g: 'entgr', kind: 'proc', work: 'nacharbeit', time: 6, x: 37, y: 22, w: 2, h: 2, ax: 37, ay: 21, inCap: 3, next: 'lack', color: '#8a5a2a' },
  { id: 'nacharb', g: 'nacharb', kind: 'store', x: 33, y: 22, w: 3, h: 2, ax: 34, ay: 21, cap: 16, next: 'ausschl', color: '#7a3b4a' },
  { id: 'lack', g: 'lack', kind: 'proc', work: 'lack', time: 3, x: 29, y: 22, w: 2, h: 2, ax: 29, ay: 21, inCap: 3, next: 'endk', color: '#2f2f2f' },
  { id: 'endk', g: 'endk', kind: 'proc', work: 'pruefen', time: 4, x: 25, y: 22, w: 2, h: 2, ax: 25, ay: 21, inCap: 4, next: 'fertig', color: '#2c6aa8' },
  { id: 'fertig', g: 'fertig', kind: 'store', x: 12, y: 20, w: 4, h: 4, ax: 16, ay: 21, cap: 80, next: null, color: '#3d5a40' },
];
const SHORT = { eingang: 'Eingang', pruef: 'Prüfung', rauen: 'Rauen', ausschl: 'Schleifen', spray: 'Flüssiggummi', fuellen: 'Spachteln', belegen: 'Belegen', huelle: 'Hülle', auto: 'Autoklav', entgr: 'Fehler', nacharb: 'Nacharbeit', lack: 'Lack', endk: 'Kontrolle', fertig: 'Versand' };
const ST = {}, GROUP = {};
STATIONS.forEach(s => {
  const [de, ru, desc] = INFO[s.g]; const n = STATIONS.filter(o => o.g === s.g).length;
  s.short = n > 1 ? `${SHORT[s.g]} ${s.id.slice(-1)}` : SHORT[s.g];
  Object.assign(s, { de: n > 1 ? `${de} ${s.id.slice(-1)}` : de, ru, desc, input: [], items: [], out: [], cur: null, prog: 0, worker: null, resIn: 0, state: 'idle', timer: 0, lastLoad: 0, busy: 0 });
  s.outCap = s.outCap || 2; ST[s.id] = s; (GROUP[s.g] = GROUP[s.g] || []).push(s);
  for (let y = s.y; y < s.y + s.h; y++) for (let x = s.x; x < s.x + s.w; x++) blocked[I(x, y)] = 1;
});

// ================= Подвесной конвейер (Hängebahn) =================
// Кольцо над цехом по ходу процесса: верх (запад→восток) → автоклавы (вниз) → низ (восток→запад) → обратно вверх.
const LOOP = [{ x: 13, y: 6 }, { x: 45, y: 6 }, { x: 45, y: 20 }, { x: 13, y: 20 }];
const SEGS = []; let LOOP_LEN = 0;
LOOP.forEach((a, i) => { const b = LOOP[(i + 1) % LOOP.length], len = Math.abs(b.x - a.x) + Math.abs(b.y - a.y); SEGS.push({ a, b, len, start: LOOP_LEN }); LOOP_LEN += len; });
function loopPos(s) {
  s = ((s % LOOP_LEN) + LOOP_LEN) % LOOP_LEN;
  const g = SEGS.find(g => s >= g.start && s < g.start + g.len) || SEGS[SEGS.length - 1], t = (s - g.start) / g.len;
  return { x: g.a.x + (g.b.x - g.a.x) * t, y: g.a.y + (g.b.y - g.a.y) * t };
}
function nearestOnLoop(px, py) {
  let best = { s: 0, d: Infinity };
  for (const g of SEGS) {
    const dx = g.b.x - g.a.x, dy = g.b.y - g.a.y, t = Math.max(0, Math.min(1, ((px - g.a.x) * dx + (py - g.a.y) * dy) / (dx * dx + dy * dy)));
    const x = g.a.x + dx * t, y = g.a.y + dy * t, d = Math.hypot(px - x, py - y);
    if (d < best.d) best = { s: g.start + t * g.len, d };
  }
  return best;
}
const HOOK_SPACING = 1.5, HOOK_SPEED = 8; // клеток; клеток в минуту (≈12 м/мин)
const HOOKS = Array.from({ length: Math.floor(LOOP_LEN / HOOK_SPACING) }, (_, k) => ({ s: k * HOOK_SPACING, tire: null, dest: null }));
STATIONS.forEach(s => { s.stopS = nearestOnLoop(s.ax, s.ay).s; });

// Что можно повесить на крюк на этом участке (или null)
function takeForHook(st) {
  if (st.kind === 'proc') {
    const k = st.out.findIndex(id => { const t = S.tires.get(id); return !t.res && t.readyAt <= S.t && (t.dest || st.next) !== 'schrott'; });
    if (k < 0) return null; const tid = st.out.splice(k, 1)[0], t = S.tires.get(tid); const dest = t.dest || st.next; t.dest = null; return { tid, dest };
  }
  if (st.kind === 'store' && st.next) {
    if (st.g === 'eingang' && wipCount() >= S.wip) return null;
    const k = st.items.findIndex(id => !S.tires.get(id).res); if (k < 0) return null;
    return { tid: st.items.splice(k, 1)[0], dest: st.next };
  }
  if (st.kind === 'auto' && st.state === 'done') {
    const k = st.items.findIndex(id => !S.tires.get(id).res); if (k < 0) return null;
    const tid = st.items.splice(k, 1)[0]; if (!st.items.length) st.state = 'idle'; return { tid, dest: st.next };
  }
  return null;
}
function updateHooks(dt) {
  if (!S.hook) return;
  const ds = HOOK_SPEED * dt;
  for (const h of HOOKS) {
    const p0 = h.s; h.s = (h.s + ds) % LOOP_LEN;
    for (const st of STATIONS) {
      if (((st.stopS - p0) % LOOP_LEN + LOOP_LEN) % LOOP_LEN >= ds) continue; // крюк не проходил эту точку
      if (h.tire && h.dest === st.g && canAcceptId(st.id)) { deposit(st.id, h.tire); h.tire = null; h.dest = null; }
      if (!h.tire) { const got = takeForHook(st); if (got) { h.tire = got.tid; h.dest = got.dest; S.tires.get(got.tid).res = false; } }
    }
  }
}

// ================= Состояние =================

const passable = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH && grid[I(x, y)] !== T_WALL && !blocked[I(x, y)];
function findPath(sx, sy, tx, ty) {
  sx = Math.round(sx); sy = Math.round(sy);
  if (sx === tx && sy === ty) return [];
  if (!passable(tx, ty)) return null;
  const N = MW * MH, g = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [];
  const push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  const h = (x, y) => { const dx = Math.abs(x - tx), dy = Math.abs(y - ty); return dx + dy + (Math.SQRT2 - 2) * Math.min(dx, dy); };
  const s = I(sx, sy); g[s] = 0; push(h(sx, sy), s);
  while (heap.length) {
    const [, cur] = pop(); if (closed[cur]) continue; closed[cur] = 1;
    const cx = cur % MW, cy = (cur / MW) | 0;
    if (cx === tx && cy === ty) { const path = []; let k = cur; while (k !== s) { path.push({ x: k % MW, y: (k / MW) | 0 }); k = came[k]; } return path.reverse(); }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const nx = cx + dx, ny = cy + dy; if (!passable(nx, ny)) continue;
      if (dx && dy && (!passable(cx + dx, cy) || !passable(cx, cy + dy))) continue;
      const ni = I(nx, ny); if (closed[ni]) continue; const ng = g[cur] + (dx && dy ? Math.SQRT2 : 1);
      if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; push(ng + h(nx, ny), ni); }
    }
  }
  return null;
}

function updateTrucks(dt) {

      while (move > 0 && tr.path.length) {
        const p = tr.path[0], dx = p.x - tr.x, dy = p.y - tr.y, d = Math.hypot(dx, dy);
        if (d <= move) { tr.x = p.x; tr.y = p.y; tr.path.shift(); move -= d; } else { tr.x += dx / d * move; tr.y += dy / d * move; tr.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; move = 0; }

      if (tr.kind === 'pickup' && !truckBusy(tr) && !ST.fertig.items.some(id => S.tires.get(id).order === o.id)) { settleOrder(o, tr); leaveTruck(tr); }

}
const truckBusy = tr => S.workers.some(w => w.job && w.job.type === 'haul' && (w.job.srcTruck === tr || w.job.dstTruck === tr));

function settleOrder(o, tr) {

}
// Отгрузка: клиент забирает готовое партиями (Teillieferung) — от 12 шин или остаток, когда заказ доделан
function checkOrders() {
  for (const o of S.orders) {
    if (o.state !== 'production' || o.pickupPending) continue;
    const ready = ST.fertig.items.filter(id => S.tires.get(id).order === o.id).length;

    if (ready >= 12 || (allDone && ready > 0)) { o.pickupPending = true; pendingTrucks.push({ kind: 'pickup', order: o, at: S.t + RI(30, 60) }); log(`${o.customer}: ${allDone ? 'заказ готов' : `готово ${ready} шин`}, вызван грузовик.`, 'good'); }

// ================= Станции: приём, выдача, WIP =================
function canAcceptId(id) {
  if (id === 'schrott') return true;
  const s = ST[id];
  if (s.kind === 'store') return s.items.length + s.resIn < s.cap;
  if (s.kind === 'auto') return s.state === 'idle' && s.items.length + s.resIn < s.cap;
  return s.input.length + s.resIn < s.inCap;
}
// Выбрать станцию группы, куда нести шину: наименьшая очередь; для автоклава — тот, что уже грузится (чтобы партии были полными)
function chooseDst(g) {
  if (g === 'schrott') return 'schrott';
  const cands = GROUP[g].filter(s => canAcceptId(s.id)); if (!cands.length) return null;
  if (g === 'auto') return cands.sort((a, b) => (b.items.length + b.resIn) - (a.items.length + a.resIn))[0].id;
  const load = s => s.kind === 'proc' ? s.input.length + s.resIn + (s.cur ? 1 : 0) : s.items.length + s.resIn;
  return cands.sort((a, b) => load(a) - load(b))[0].id;
}
const accessOf = id => id === 'schrott' ? SCRAP_ACCESS : { x: ST[id].ax, y: ST[id].ay };
function deposit(id, tid) {
  const t = S.tires.get(tid); t.res = false; t.dest = null;
  if (id === 'schrott') { S.scrap++; const o = orderById(t.order); if (o) o.scrapped++; S.tires.delete(tid); return; }
  const s = ST[id]; s.resIn = Math.max(0, s.resIn - 1);
  if (s.kind === 'store') {
    s.items.push(tid);
    if (s.g === 'eingang' && !t.tIn) t.tIn = S.t;
    if (s.g === 'fertig') t.stage = 'lack';
    if (s.g === 'fertig') { const o = orderById(t.order); if (o) o.finished++; S.doneToday++; if (t.tIn) { S.leadTimes.push(S.t - t.tIn); if (S.leadTimes.length > 60) S.leadTimes.shift(); } }
  } else if (s.kind === 'auto') { s.items.push(tid); s.lastLoad = S.t; }
  else s.input.push(tid);
}
function wipCount() {
  let n = 0;
  for (const s of STATIONS) if (s.g !== 'eingang' && s.g !== 'fertig') n += s.input.length + s.out.length + s.items.length + (s.cur ? 1 : 0);
  for (const w of S.workers) if (w.carry && w.job && w.job.src !== 'eingang' && !w.job.srcTruck && !w.job.dstTruck) n++;
  for (const s of GROUP.pruef) n += s.resIn;

function matsOk(s) { if (!s.mat) return true; for (const [k, v] of Object.entries(s.mat)) if (S.mats[k] < v) return false; return true; }

// ================= Задачи =================
function genJobs() {
  const jobs = [];
  for (const tr of S.trucks) {
    if (tr.state !== 'docked') continue;
    const acc = DOCKS[tr.dock].access;
    if (tr.kind === 'deliver') {
      const tid = tr.cargo.find(id => !S.tires.get(id).res), dst = tid && chooseDst('eingang');
      if (dst) jobs.push({ type: 'haul', work: 'transport', tire: tid, srcTruck: tr, from: acc, dst, to: accessOf(dst) });
    } else {
      const tid = ST.fertig.items.find(id => !S.tires.get(id).res && S.tires.get(id).order === tr.order);
      if (tid) jobs.push({ type: 'haul', work: 'transport', tire: tid, src: 'fertig', from: accessOf('fertig'), dstTruck: tr, to: acc });
    }
  }
  for (const s of STATIONS) {
    const from = accessOf(s.id);
    if (s.kind === 'store' && s.next && !S.hook) {
      const tid = s.items.find(id => !S.tires.get(id).res);
      const wipOk = s.g !== 'eingang' || wipCount() < S.wip;
      const dst = tid && wipOk && chooseDst(s.next);
      if (dst) jobs.push({ type: 'haul', work: 'transport', tire: tid, src: s.id, from, dst, to: accessOf(dst) });
    }
    if (s.kind === 'proc') {
      for (const tid of s.out) {
        const t = S.tires.get(tid); if (t.res || t.readyAt > S.t) continue;
        if (S.hook && (t.dest || s.next) !== 'schrott') continue; // между участками шины едут на крюках; руками — только лом
        const dst = chooseDst(t.dest || s.next); if (!dst) continue;
        jobs.push({ type: 'haul', work: 'transport', tire: tid, src: s.id, from, dst, to: accessOf(dst) });
      }
      if (!s.worker && !s.cur && s.input.length && s.out.length < s.outCap && matsOk(s)) jobs.push({ type: 'work', work: s.work, st: s, to: from });
    }
    if (s.kind === 'auto') {
      if (s.state === 'done' && !S.hook) { const tid = s.items.find(id => !S.tires.get(id).res), dst = tid && chooseDst(s.next); if (dst) jobs.push({ type: 'haul', work: 'transport', tire: tid, src: s.id, from, dst, to: accessOf(dst) }); }
      const late = clock() >= 20 * 60 + 30 && s.items.length >= 4; // вечером запускаем неполную партию, чтобы автоклав работал ночью
      if (s.state === 'idle' && !s.worker && s.items.length && s.resIn === 0 && (s.items.length >= s.cap || S.t - s.lastLoad >= 50 || late))
        jobs.push({ type: 'start', work: 'vulkan', st: s, to: from });
    }
  }
  return jobs;
}
function reserve(j, w) {

    const t = S.tires.get(j.tire); if (!t || t.res) return false;
    if (j.dst && !canAcceptId(j.dst)) return false;
    t.res = true; if (j.dst && j.dst !== 'schrott') ST[j.dst].resIn++;
    j.steps = [{ go: j.from }, { pick: true }, { go: j.to }, { drop: true }];
  } else { if (j.st.worker) return false; j.st.worker = w.id; j.steps = [{ go: j.to }, { work: true }]; }
  j.i = 0; return true;
}
function releaseJob(w) {
  const j = w.job; if (!j) return;
  if (j.type === 'haul') {

function assignJobs() {
  const idle = S.workers.filter(w => !w.away && !w.job);
  if (!idle.length) return;
  let jobs = null;
  for (const w of idle) {
    if (!onShift(w)) { w.job = { type: 'home', steps: [{ go: EXIT }, { leave: true }], i: 0 }; continue; }
    if (w.energy < 28) { const seat = SEATS.find(s => !S.workers.some(o => o.seat === s)) || SEATS[0]; w.seat = seat; w.job = { type: 'break', steps: [{ go: { x: seat[0], y: seat[1] } }, { rest: true }], i: 0 }; continue; }
    jobs = jobs || genJobs();

function workDuration(w, s) { return (s.time || 10) * (1.45 - w.skills[s.work] * 0.065); }
function finishProc(s, w) {

    else if (t.defect) {

      if (t.badCasing || t.rework > 0) { t.dest = 'schrott'; log(`${w.name}: финальный контроль — шина #${t.id} в лом.`, 'bad'); }
      else { t.rework++; t.defect = false; t.dest = 'nacharb'; log(`${w.name}: финальный контроль — шина #${t.id} на переделку.`, 'warn'); }
    }

function updateWorker(w, dt) {

  if (!w.job) { w.state = 'idle'; return; }
  const j = w.job, st = j.steps[j.i];
  if (!st) { w.job = null; w.state = 'idle'; return; }
  if (st.go) {
    w.state = 'walk';
    if (!w.path) { w.path = findPath(w.x, w.y, st.go.x, st.go.y); if (!w.path) { releaseJob(w); return; } }
    let move = WALK * dt * (w.energy < 15 ? 0.7 : 1);
    while (move > 0 && w.path.length) {
      const p = w.path[0], dx = p.x - w.x, dy = p.y - w.y, d = Math.hypot(dx, dy);
      if (d <= move) { w.x = p.x; w.y = p.y; w.path.shift(); move -= d; S.stats.walk += d; S.stats.walkToday += d; }
      else { w.x += dx / d * move; w.y += dy / d * move; S.stats.walk += move; S.stats.walkToday += move; move = 0; }
    }

  } else if (st.pick) {

    else { const s = ST[j.src]; const arr = s.kind === 'proc' ? s.out : s.items; const k = arr.indexOf(j.tire); if (k >= 0) { arr.splice(k, 1); ok = true; if (s.kind === 'auto' && !s.items.length) s.state = 'idle'; } }
    if (!ok) { releaseJob(w); return; }

  } else if (st.drop) {
    st.t = (st.t || 0) + dt; if (st.t < 0.5) return;

    w.carry = null; j.i++;
  } else if (st.work) {
    w.state = 'work'; const s = j.st;
    if (j.type === 'start') {
      st.t = (st.t || 0) + dt; s.prog = st.t / 10;
      if (st.t >= 10) { s.state = 'running'; s.timer = s.cycle; s.worker = null; s.prog = 0; log(`${w.name}: ${s.de} запущен, партия ${s.items.length} шт.`, 'info'); j.i++; }
    } else {
      if (!s.cur) {
        if (!s.input.length || !matsOk(s)) { releaseJob(w); return; }
        s.cur = s.input.shift(); if (s.mat) for (const [k, v] of Object.entries(s.mat)) S.mats[k] -= v;
        st.dur = workDuration(w, s); st.t = 0;
      }

    }

  } else if (st.leave) { w.away = true; w.state = 'home'; w.job = null; w.x = EXIT.x; w.y = EXIT.y; return; }
  if (j.i >= j.steps.length) { w.job = null; w.state = 'idle'; }
}

// ================= Время и экономика =================
function simulate(dt) {
  const prev = clock();
  S.t += dt;
  const c = clock();
  const present = S.workers.filter(w => !w.away).length;
  const wage = present * WAGE_PER_HOUR / 60 * dt; S.money -= wage; S.stats.wages += wage;
  if (prev < SHIFT_CHANGE && c >= SHIFT_CHANGE) log('14:00 — пересменка: Frühschicht уходит, Spätschicht приходит.', 'info');
  if (prev < DAY_END && c >= DAY_END) log('22:00 — конец смены. Ночью работают только автоклавы.', 'info');
  if (c < prev) { // полночь
    S.money -= OVERHEAD_PER_DAY; S.stats.overhead += OVERHEAD_PER_DAY;
    log(`День ${day() - 1}: готово ${S.doneToday} шин, пройдено ${Math.round(S.stats.walkToday * 1.5)} м. Аренда/энергия −${eur(OVERHEAD_PER_DAY)}.`, 'info');
    S.doneYesterday = S.doneToday; S.doneToday = 0; S.stats.walkToday = 0;
  }
  if (prev < DAY_START && c >= DAY_START) log(`День ${day()}: 06:00, начало Frühschicht.`, 'info');
  updateTrucks(dt);
  for (let i = S.matOrders.length - 1; i >= 0; i--) { const m = S.matOrders[i]; if (S.t >= m.at) { S.mats[m.key] += m.qty; log(`Поставка: ${m.qty} × ${MATS[m.key].de}.`, 'good'); S.matOrders.splice(i, 1); } }
  if (S.autoBuy) for (const [k, m] of Object.entries(MATS)) { const coming = S.matOrders.filter(o => o.key === k).reduce((a, o) => a + o.qty, 0); if (S.mats[k] + coming < m.min && S.money > m.price) buy(k, true); }
  for (const a of GROUP.auto) { if (a.state === 'running') { a.timer -= dt; a.busy += dt; if (a.timer <= 0) { a.state = 'done'; log(`${a.de}: партия готова, разгружаем.`, 'good'); } } }
  if (S.t - S.lastOffer > 90 && S.offers.length < 5 && isDay()) { S.lastOffer = S.t; makeOffer(); }
  S.offers = S.offers.filter(o => { if (S.t > o.expires) { log(`Запрос ${o.customer} истёк.`, 'muted'); return false; } return true; });
  for (let i = S.complaints.length - 1; i >= 0; i--) { const cpl = S.complaints[i]; if (S.t >= cpl.at) { S.money -= 350; S.stats.penalties += 350; S.rep = Math.max(0, S.rep - 4); log(`Рекламация от ${cpl.order}: брак восстановленной шины (−350 €, репутация −4).`, 'bad'); S.complaints.splice(i, 1); } }
  updateHooks(dt);
  checkOrders();
  assignJobs();
  for (const w of S.workers) updateWorker(w, dt);
}
function advance(minutes) { let left = minutes; while (left > 0) { const d = Math.min(0.25, left); simulate(d); left -= d; } }
function buy(k, auto = false) {
  const m = MATS[k]; if (S.money < m.price) return;
  S.money -= m.price; S.stats.materials += m.price; S.matOrders.push({ key: k, qty: m.pack, at: S.t + 120 });
  log(`${auto ? 'Автозаказ' : 'Заказано'}: ${m.pack} × ${m.de} (${eur(m.price)}), поставка через 2 ч.`);
}

    if (s.mat) q += ` · расход: ${Object.entries(s.mat).map(([k, v]) => v + '× ' + MATS[k].de).join(', ')}`;
    el.innerHTML = `<div class="row"><b>${s.de}</b><span class="muted">${s.ru}</span></div><div class="muted" style="margin:3px 0">${s.desc}</div><div>${q}</div>${s.work ? `<div class="muted">Работа: ${WORK_RU[s.work]}${s.time ? `, ~${s.time} мин на шину` : ''} · загрузка ${util(s)}%</div>` : ''}`;
  } else if (sel.d) el.innerHTML = `<b>${sel.d.label || sel.d.id}</b><div class="muted">${sel.d.desc}</div>`;
}
function renderPanel() {
  const p = $('panel');
  if (tab === 'overview') {
    const rows = STATIONS.map(s => {
      let load, warn = false;
      if (s.kind === 'store') { load = `${s.items.length}/${s.cap}`; warn = s.items.length >= s.cap * 0.8; }
      else if (s.kind === 'auto') load = s.state === 'running' ? `🔥 ${Math.ceil(s.timer)} мин` : s.state === 'done' ? 'готово' : `${s.items.length}/${s.cap}`;
      else { load = `${s.input.length}▸${s.cur ? '●' : '○'}▸${s.out.length}`; warn = s.input.length >= s.inCap && !s.cur; }
      const miss = s.kind === 'proc' && !matsOk(s) ? ' <span class="bad">нет материала</span>' : '';
      const u = s.kind === 'proc' || s.kind === 'auto' ? `${util(s)}%` : '';
      return `<tr data-st="${s.id}" style="cursor:pointer"><td>${s.de}<div class="muted" style="font-size:11px">${s.ru}</div></td><td class="${warn ? 'warn' : ''}">${load}${miss}</td><td class="muted">${u}</td></tr>`;
    }).join('');
    p.innerHTML = `<h3>Показатели</h3>
      <div class="card">
        <div class="row"><span>Готово сегодня / вчера</span><b>${S.doneToday} / ${S.doneYesterday} шин</b></div>
        <div class="row"><span title="Durchlaufzeit: от выгрузки до склада готовой продукции">Среднее время прохождения</span><b>${avgLead() ? Math.floor(avgLead() / 60) + ' ч ' + (avgLead() % 60) + ' мин' : '—'}</b></div>
        <div class="row"><span title="Сколько метров прошли рабочие сегодня — главный показатель для оптимизации расстановки">Пройдено рабочими сегодня</span><b>${Math.round(S.stats.walkToday * 1.5).toLocaleString('de-DE')} м</b></div>
        <div class="row"><span title="Kanban: сколько шин одновременно пускать в линию. Мало — станки простаивают, много — заторы.">WIP-лимит: в линии <b>${wipCount()}</b> из</span><span><button data-wip="-2">−</button> <b>${S.wip}</b> <button data-wip="2">+</button></span></div>
        <div class="row"><label title="Подвесной конвейер на крюках (Hängebahn): шины едут между участками сами, люди только снимают и вешают. Выключите — и шины будут катать вручную."><input type="checkbox" data-hookbahn ${S.hook ? 'checked' : ''}> Hängebahn — подвесной конвейер на крюках</label><span class="muted">${HOOKS.filter(h => h.tire).length}/${HOOKS.length} крюков заняты</span></div>
      </div>
      <h3>Технологический поток</h3>
      <table><tr><th>Станция</th><th>Очередь (вход▸работа▸выход)</th><th>Загр.</th></tr>${rows}</table>
      <div class="card" style="margin-top:10px">
        <div class="row"><span>Выручка</span><b class="good">${eur(S.stats.revenue)}</b></div>
        <div class="row"><span>Зарплата / материалы</span><b>${eur(S.stats.wages)} / ${eur(S.stats.materials)}</b></div>
        <div class="row"><span>Аренда и энергия / рекламации</span><b>${eur(S.stats.overhead)} / ${eur(S.stats.penalties)}</b></div>
        <div class="row"><span>Лом всего</span><b>${S.scrap}</b></div>
      </div>
      <div class="muted" style="font-size:11px">Красная рамка на станции и оранжевая очередь — узкое место.</div>
      <h3 style="margin-top:12px">Расчёт оборудования на ${PLAN.P} шин/сутки</h3>
      <div class="muted" style="font-size:11px;margin-bottom:4px">Методика проектирования шиноремонтных участков: N = P·t / (T·Kз), для автоклава ещё делим на вместимость. P — суточная программа, t — время на шину (цикл автоклава + 30 мин загрузки), T — рабочее время (2 смены; у автоклава + ночная партия), Kз — коэффициент загрузки.</div>
      <table><tr><th>Участок</th><th>Расчёт</th><th>Нужно</th><th>Есть</th></tr>${equipCalc().map(r => `<tr><td>${r.name}</td><td class="muted" style="font-size:10px">${r.formula} = ${r.need.toFixed(2)}</td><td><b>${r.n}</b></td><td class="${r.have >= r.n ? 'good' : 'bad'}">${r.have}</td></tr>`).join('')}</table>`;
  } else if (tab === 'workers') {
    const head = WORKS.map(k => `<th title="${WORK_RU[k]}">${WORK_RU[k].slice(0, 5)}</th>`).join('');
    const rows = S.workers.map(w => `<tr><td><b data-selw="${w.id}" style="cursor:pointer">${w.name.split(' ')[0]}</b> <span class="shift">${w.shift === 'F' ? 'F' : 'S'}</span><div class="muted" style="font-size:10px">${jobText(w)}</div></td>${WORKS.map(k => `<td><button class="prio p${w.prio[k]}" data-prio="${w.id}:${k}" title="${WORK_RU[k]}: навык ${w.skills[k].toFixed(1)}">${w.prio[k] || '–'}</button></td>`).join('')}<td><button data-shift="${w.id}" title="Сменить смену">⇄</button></td></tr>`).join('');
    p.innerHTML = `<h3>Приоритеты работ</h3><div class="muted" style="font-size:11px;margin-bottom:6px">Клик: 1→2→3→4→выкл. 1 = делает в первую очередь. Наведите — навык. F = Frühschicht 06–14, S = Spätschicht 14–22, ⇄ — перевести в другую смену.</div>
      <table><tr><th></th>${head}<th></th></tr>${rows}</table>
      <div class="card" style="margin-top:10px"><div class="row"><span>Нанять рабочего (400 € разово, ${WAGE_PER_HOUR} €/ч)</span><button data-act="hire">Нанять</button></div></div>`;
  } else if (tab === 'orders') {
    const offers = S.offers.map(o => `<div class="card"><div class="row"><b>${o.customer}</b><span>${o.qty} шт × ${o.price} €</span></div><div class="muted">Срок: ${fmtDT(o.deadline)} · запрос истекает в ${fmtClock(o.expires)}</div><div class="row" style="margin-top:6px"><span class="good">${eur(o.qty * o.price)}</span><span><button data-accept="${o.id}">Принять</button> <button data-decline="${o.id}">Отказ</button></span></div></div>`).join('') || '<div class="muted">Новых запросов нет.</div>';
    const st = { incoming: 'грузовик с каркасами в пути', production: 'в производстве', done: 'закрыт' };
    const active = S.orders.filter(o => o.state !== 'done'), done = S.orders.filter(o => o.state === 'done').slice(-6).reverse();
    const card = o => `<div class="card"><div class="row"><b>${o.customer}</b><span class="${o.state === 'done' ? 'muted' : ''}">${st[o.state]}${o.pickupPending ? ' · грузовик едет' : ''}</span></div><div class="row"><span>Готово ${o.finished}/${o.qty}, отгружено ${o.shippedN}, лом ${o.scrapped}</span><span class="${S.t > o.deadline && o.state !== 'done' ? 'bad' : 'muted'}">до ${fmtDT(o.deadline)}</span></div><div class="bar"><i style="width:${(o.finished + o.scrapped) / o.qty * 100}%"></i></div></div>`;
    p.innerHTML = `<h3>Запросы клиентов</h3>${offers}<h3>В работе (${active.length})</h3>${active.map(card).join('') || '<div class="muted">Нет.</div>'}<h3>Закрытые</h3>${done.map(card).join('') || '<div class="muted">Нет.</div>'}`;
  } else if (tab === 'stock') {
    const rows = Object.entries(MATS).map(([k, m]) => { const coming = S.matOrders.filter(o => o.key === k).reduce((a, o) => a + o.qty, 0); return `<div class="card"><div class="row"><b>${m.de}</b><span class="${S.mats[k] < 10 ? 'bad' : ''}">${S.mats[k]} шт${coming ? ` <span class="muted">(+${coming} в пути)</span>` : ''}</span></div><div class="row"><span class="muted">${m.ru}</span><button data-buy="${k}">+${m.pack} за ${eur(m.price)}</button></div></div>`; }).join('');
    p.innerHTML = `<h3>Материалы</h3><div class="card"><label><input type="checkbox" data-autobuy ${S.autoBuy ? 'checked' : ''}> Автозаказ, когда остаток меньше 30</label></div>${rows}<div class="muted" style="font-size:11px">Поставка через 2 игровых часа. На одну шину: 1 протектор, 1 связующая резина, 1 клей, 1 ремонтная резина.</div>`;
  } else if (tab === 'log') p.innerHTML = `<div class="log">${S.log.map(l => `<div><span class="muted">${l.t}</span> <span class="${l.cls}">${l.msg}</span></div>`).join('')}</div>`;
}
function renderTop() {
  $('tDay').textContent = day(); $('tClock').textContent = fmtClock(clock());
  const c = clock(); $('tShift').textContent = c >= DAY_START && c < SHIFT_CHANGE ? 'Frühschicht' : c >= SHIFT_CHANGE && c < DAY_END ? 'Spätschicht' : 'Nacht';
  $('tMoney').textContent = eur(S.money); $('tMoney').className = S.money < 0 ? 'bad' : '';
  $('tRep').textContent = Math.round(S.rep); $('tToday').textContent = S.doneToday;
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', Number(b.dataset.speed) === S.speed));
}
// Включить/выключить конвейер. При выключении шины с крюков возвращаются на ближайший участок-получатель.
function setHook(on) {
  S.hook = on;
  if (!on) for (const h of HOOKS) if (h.tire) { const dst = chooseDst(h.dest) || GROUP[h.dest][0].id; deposit(dst, h.tire); h.tire = null; h.dest = null; }
  log(on ? 'Hängebahn включена: шины едут на крюках.' : 'Hängebahn выключена: шины катают вручную.', 'info');
}
function hire() {
  if (S.money < 400) return; S.money -= 400;
  const name = pick(FIRST) + ' ' + pick(LAST), main = {}; main[pick(WORKS)] = RI(5, 8); main[pick(WORKS)] = RI(4, 7);
  const w = makeWorker(name, 'Mitarbeiter', S.workers.filter(x => x.shift === 'F').length <= S.workers.filter(x => x.shift === 'S').length ? 'F' : 'S', main);
  S.workers.push(w); log(`Нанят ${name} (${w.shift === 'F' ? 'Frühschicht' : 'Spätschicht'}).`, 'good');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-st], [data-selw], [data-autobuy], [data-hookbahn]'); if (!b) return;
  if (b.dataset.hookbahn !== undefined) setHook(b.checked);
  if (b.dataset.speed !== undefined) { S.speed = Number(b.dataset.speed); if (S.speed) S.lastSpeed = S.speed; }
  if (b.dataset.tab) { tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); }
  if (b.dataset.prio) { const [id, k] = b.dataset.prio.split(':'); const w = S.workers.find(x => x.id === Number(id)); w.prio[k] = (w.prio[k] + 1) % 5; }
  if (b.dataset.shift) { const w = S.workers.find(x => x.id === Number(b.dataset.shift)); w.shift = w.shift === 'F' ? 'S' : 'F'; }
  if (b.dataset.accept) acceptOffer(Number(b.dataset.accept));
  if (b.dataset.decline) declineOffer(Number(b.dataset.decline));
  if (b.dataset.buy) buy(b.dataset.buy);
  if (b.dataset.autobuy !== undefined) S.autoBuy = b.checked;
  if (b.dataset.act === 'hire') hire();
  if (b.dataset.wip) S.wip = Math.max(2, Math.min(80, S.wip + Number(b.dataset.wip)));
  if (b.dataset.st) S.selected = { st: ST[b.dataset.st] };
  if (b.dataset.selw) S.selected = { w: S.workers.find(x => x.id === Number(b.dataset.selw)) };
  renderPanel(); renderSel(); renderTop();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { S.speed = S.speed ? 0 : (S.lastSpeed || 1); e.preventDefault(); }
  if (e.key === '1') S.speed = 1; if (e.key === '2') S.speed = 3; if (e.key === '3') S.speed = 10;
  if (S.speed) S.lastSpeed = S.speed; renderTop();
});
function hitTest(mx, my) {
  const r = cv.getBoundingClientRect(), x = (mx - r.left) / scale / TILE - 0.5, y = (my - r.top) / scale / TILE - 0.5;
  const w = S.workers.find(w => !w.away && Math.hypot(w.x - x, w.y - y) < 0.7); if (w) return { w };
  const tx = Math.floor(x + 0.5), ty = Math.floor(y + 0.5);
  const s = STATIONS.find(s => tx >= s.x && tx < s.x + s.w && ty >= s.y && ty < s.y + s.h); if (s) return { st: s };
  const d = DECOR.find(d => tx >= d.x && tx < d.x + d.w && ty >= d.y && ty < d.y + d.h); if (d) return { d };
  return null;
}
cv.addEventListener('click', e => { S.selected = hitTest(e.clientX, e.clientY); renderSel(); });
cv.addEventListener('mousemove', e => {
  const h = hitTest(e.clientX, e.clientY), tip = $('tip');
  if (h && (h.st || h.d)) { const o = h.st || h.d; tip.innerHTML = `<b>${o.de || o.label}</b>${o.ru ? ` — ${o.ru}` : ''}<div class="muted">${o.desc}</div>`; tip.style.display = 'block'; const wr = $('wrap').getBoundingClientRect(); tip.style.left = Math.min(e.clientX - wr.left + 14, wr.width - 330) + 'px'; tip.style.top = (e.clientY - wr.top + 14) + 'px'; }
  else tip.style.display = 'none';
});
cv.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });

// ================= Главный цикл =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.speed > 0) advance(dt * MIN_PER_SEC * S.speed);
  render();
  uiT += dt; if (uiT > 0.3) { uiT = 0; renderTop(); renderSel(); if (!document.querySelector('#panel:hover') || tab === 'log') renderPanel(); }
  requestAnimationFrame(frame);
}
makeOffer(); makeOffer(); makeOffer();
resize(); renderTop(); renderSel(); renderPanel();
log('Добро пожаловать в Reifenwerk! 15 рабочих, две смены. Примите заказы во вкладке «Заказы».', 'info');
requestAnimationFrame(frame);

// ================= API для автоматической игры и тестов =================
window.RW = {
  S, ST, STATIONS, GROUP, HOOKS, advance, acceptOffer, declineOffer, buy, hire, wipCount, setHook,
  setSpeed: v => { S.speed = v; renderTop(); },
  setPrio: (name, work, p) => { const w = S.workers.find(w => w.name.startsWith(name)); if (w) w.prio[work] = p; },
  summary: () => ({
    day: day(), clock: fmtClock(clock()), money: Math.round(S.money), rep: Math.round(S.rep), shipped: S.shipped, scrap: S.scrap,
    doneToday: S.doneToday, doneYesterday: S.doneYesterday, leadMin: avgLead(), walkTodayM: Math.round(S.stats.walkToday * 1.5), wip: `${wipCount()}/${S.wip}`, hooksBusy: HOOKS.filter(h => h.tire).length,
    stations: Object.fromEntries(STATIONS.map(s => [s.id, s.kind === 'proc' ? `${s.input.length}>${s.cur ? 1 : 0}>${s.out.length} ${util(s)}%` : s.kind === 'auto' ? `${s.state}:${s.items.length} ${util(s)}%` : String(s.items.length)])),
    workers: S.workers.map(w => `${w.name.split(' ')[0]}(${w.shift}): ${jobText(w)} (${Math.round(w.energy)}%)`),
    offers: S.offers.map(o => `${o.id} ${o.customer} ${o.qty}×${o.price}`),
    orders: S.orders.filter(o => o.state !== 'done').map(o => `${o.customer} ${o.state} ${o.finished}/${o.qty} лом ${o.scrapped}`),
    mats: { ...S.mats }, trucks: S.trucks.map(t => `${t.kind} ${t.state} ${t.cargo.length}`),
  }),
};
})();
</script>
</body>
