<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reifenwerk</title>
<style>
  :root {
    --bg: #17191e; --panel: #22252c; --panel2: #2a2e37; --line: #363b46;
    --text: #e7e7e7; --muted: #9aa0aa; --accent: #f0a030; --good: #62c370; --bad: #e35d5d; --info: #5aa8e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  #topbar .stat b { font-variant-numeric: tabular-nums; }
  .speed button { min-width: 38px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  #wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; background: rgba(20,22,27,.95); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 320px; display: none; font-size: 12px; }
  #side { width: 420px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #sel { padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 64px; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; color: var(--muted); }
  #tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); background: transparent; }
  #panel { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--accent); } .info { color: var(--info); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .prio { width: 24px; padding: 2px 0; text-align: center; font-weight: 700; }
  .p1 { background: #2f6b3a; } .p2 { background: #4f6b2f; } .p3 { background: #6b5d2f; } .p4 { background: #6b412f; } .p0 { background: #2a2e37; color: #555; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar { height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); }
  .log div { padding: 2px 0; border-bottom: 1px dashed #30343d; }
  h3 { margin: 4px 0 8px; font-size: 13px; color: var(--accent); }
  .shift { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #3a3f4b; color: #ccc; }
  @media (max-width: 900px) { body { flex-direction: column; } #side { width: 100%; height: 45vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="main">
  <div id="topbar">
    <span class="title">REIFENWERK</span>
    <a href="stations.html" style="color:#9fc6ff;text-decoration:none;font-weight:600">Участки по отдельности ▸</a>
    <span class="stat">День <b id="tDay">1</b>, <b id="tClock">06:00</b> <span id="tShift" class="muted"></span></span>

    <span><button id="zoomOut" title="Отдалить (−, колесо мыши)">🔍−</button> <button id="zoomIn" title="Приблизить (+, колесо мыши). Двигать: WASD или правая кнопка мыши">🔍+</button></span>

  <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
</div>
<div id="side">
  <div id="sel"></div>
  <div id="tabs">
    <button data-tab="overview" class="on">Цех</button>
    <button data-tab="workers">Рабочие</button>
    <button data-tab="orders">Заказы</button>
    <button data-tab="stock">Склад</button>
    <button data-tab="log">Журнал</button>
  </div>
  <div id="panel"></div>
</div>
<script src="pixel.js"></script>
<script>
'use strict';
(() => {
// ================= Константы =================
const TILE = 24, MW = 76, MH = 52;
const MIN_PER_SEC = 0.75;     // игровых минут в реальную секунду на скорости 1×
const WALK = 18;              // клеток за игровую минуту (клетка ≈ 1,5 м, ≈ 0,45 м/с с учётом манёвров)
const TRUCK_SPEED = 9;
const DAY_START = 6 * 60, SHIFT_CHANGE = 14 * 60, DAY_END = 22 * 60;
const WAGE_PER_HOUR = 21, OVERHEAD_PER_DAY = 2800;
const FORK = 6;                                   // шин на вилах погрузчика за рейс
const CART = 4;                                   // шин на тележке (Rollwagen)
const liftTime = (j, what) => j.crane === what ? 1.5 : j.fork || j.cart ? 0.8 : 0.5;
const DUSTY = ["rauen", "ausschl", "entgr"];       // участки, где сыплется резиновая пыль и стружка
const BREAK_MIN = 1000;                           // средняя наработка на отказ, минут работы (пыль и износ ускоряют)
// Типичные поломки по участкам: немецкое название — что случилось
const FAULTS = {
  pruef: [['Spreizer-Hydraulik undicht', 'течёт гидравлика расширителя бортов'], ['Prüflampe defekt', 'перегорела лампа осмотра']],
  rauen: [['Raspelmesser stumpf', 'затупились ножи рашпиля'], ['Antriebsriemen gerissen', 'порвался приводной ремень'], ['Felgenspanner klemmt', 'заело зажим обода']],
  ausschl: [['Druckluftschlauch geplatzt', 'лопнул шланг сжатого воздуха'], ['Schleifer defekt', 'сломалась пневмошлифовка']],
  spray: [['Sprühdüse verstopft', 'засорилась форсунка'], ['Absaugung ausgefallen', 'отказала вытяжка']],
  fuellen: [['Extruder-Heizung defekt', 'не греет пистолет-экструдер'], ['Schnecke blockiert', 'заклинило шнек экструдера']],
  aufbau: [['Extruder der Wickelmaschine verstopft', 'забился экструдер намоточной машины'], ['Wickeltrommel klemmt', 'заело барабан намотки']],
  presse: [['Heizbalg undicht', 'течёт варочная камера (Heizbalg)'], ['Dampfventil klemmt', 'заело паровой клапан'], ['Formsegment klemmt', 'заело сегмент пресс-формы']],
  scan: [['Scanner defekt', 'сломался сканер штрихкодов']],
  entgr: [['Entgratmesser stumpf', 'затупился нож обрезного станка'], ['Drehteller klemmt', 'заело вращение станка']],
  endk: [['Prüfmaschine Fehler', 'ошибка машины финального контроля'], ['Etikettendrucker defekt', 'сломался принтер этикеток']],
  antrieb: [['Kette gesprungen', 'соскочила цепь конвейера'], ['Antriebsmotor überhitzt', 'перегрелся мотор привода']],
};

// ================= Случайность (воспроизводимая) =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search);
const rnd = mulberry32(Number(params.get('seed')) || 20261015);
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ================= Карта =================
// Планировка по эталонному цеху (plant/README.md): 1 клетка ≈ 1,5 м.
// Длинная ось корпуса — слева (юго-запад) направо (северо-восток); сверху улица и двор, снизу зона Ф.
const T_GRASS = 0, T_ROAD = 1, T_YARD = 2, T_FLOOR = 3, T_WALL = 4, T_DOOR = 5;
const grid = new Uint8Array(MW * MH), blocked = new Uint8Array(MW * MH);
const I = (x, y) => y * MW + x;
const area = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[I(x, y)] = t; };
const wallH = (y, x0, x1) => area(x0, y, x1, y, T_WALL), wallV = (x, y0, y1) => area(x, y0, x, y1, T_WALL);
area(0, 0, MW - 1, MH - 1, T_YARD);
area(0, 0, MW - 1, 2, T_ROAD);                                   // улица
area(0, 50, MW - 1, MH - 1, T_GRASS); area(72, 3, MW - 1, 12, T_GRASS); area(0, 43, 1, 49, T_GRASS);
area(2, 9, 25, 26, T_FLOOR);                                     // К1 — навес без стен
area(2, 27, 26, 42, T_FLOOR); wallH(27, 2, 26); wallV(2, 27, 42); wallH(42, 2, 26);   // К2 — склад материалов
area(26, 9, 66, 49, T_FLOOR); wallH(9, 26, 66); wallH(49, 26, 66); wallV(26, 9, 49); wallV(66, 9, 49); // главный корпус
area(66, 23, 71, 31, T_FLOOR); wallH(23, 66, 71); wallH(31, 66, 71); wallV(71, 23, 31);              // Р — пандус отгрузки
wallH(16, 26, 35); wallV(35, 9, 23); wallH(23, 26, 66); wallH(40, 26, 66);           // С1|С2, С|С3, левый пролёт|Ж, Ж|Ф
area(66, 24, 66, 30, T_FLOOR);                                   // Ж4 открыт на пандус
for (const [x, y] of [[30, 9], [26, 19], [26, 38], [12, 27], [23, 42], [30, 16], [35, 12], [35, 19], [27, 23], [41, 23], [42, 23], [49, 23],
  [60, 23], [61, 23], [29, 40], [53, 40], [67, 23], [68, 23], [69, 23], [70, 23]]) grid[I(x, y)] = T_DOOR;

const ZONES = [
  { name: 'Pausenraum', kind: 'rest', x: 27, y: 10, w: 8, h: 6, color: 'rgba(110,160,110,.28)' },
  { name: 'Parkplatz', kind: 'parking', x: 38, y: 4, w: 24, h: 4, color: 'rgba(80,80,80,.35)' },
  { name: 'К1 VORDACH', kind: 'shed', x: 2, y: 9, w: 24, h: 18, color: 'rgba(150,140,120,.18)' },
  { name: 'К2 MATERIAL', kind: 'label', x: 3, y: 28, w: 23, h: 14, color: 'rgba(120,110,90,.10)' },
  { name: 'С2 PRÜFUNG', kind: 'label', x: 27, y: 17, w: 8, h: 6, color: 'rgba(90,130,200,.10)' },
  { name: 'С3 KARKASSENLAGER', kind: 'label', x: 36, y: 10, w: 30, h: 13, color: 'rgba(90,130,200,.10)' },
  { name: 'Ж1 VORBEREITUNG', kind: 'label', x: 27, y: 24, w: 10, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж2 AUFBAU', kind: 'label', x: 37, y: 24, w: 9, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ж3 PRESSEN', kind: 'label', x: 46, y: 24, w: 8, h: 16, color: 'rgba(240,190,40,.10)' },
  { name: 'Ж4 FINISH', kind: 'label', x: 54, y: 24, w: 12, h: 16, color: 'rgba(240,190,40,.14)' },
  { name: 'Ф KLEINREIFEN', kind: 'label', x: 27, y: 41, w: 39, h: 8, color: 'rgba(150,110,200,.12)' },
];
const DECOR = [
  { id: 'regal', label: 'Materiallager', x: 4, y: 29, w: 8, h: 2, color: '#5b4a3a', desc: 'К2 — склад материалов: протекторы, ремонтная резина (Füllgummi), запчасти. Остатки — во вкладке «Склад».' },
  { id: 'regal', label: '', x: 4, y: 33, w: 8, h: 2, color: '#5b4a3a', desc: 'К2 — склад материалов.' },
  { id: 'kaffee', label: '☕', x: 34, y: 10, w: 1, h: 1, color: '#6b3f2a', desc: 'Кофемашина. Здесь рабочие восстанавливают силы.' },
  { id: 'tisch', label: '', x: 28, y: 12, w: 2, h: 1, color: '#7a5a3a', desc: 'С1: бытовка и столовая (столовая — на втором этаже).' },
  { id: 'tisch', label: '', x: 31, y: 12, w: 2, h: 1, color: '#7a5a3a', desc: 'С1: бытовка и столовая.' },
  { id: 'desk', label: '', x: 33, y: 14, w: 2, h: 1, color: '#5a5f7a', desc: 'Стол мастера: заказы, планирование, качество. Мастер — это вы.' },
  { id: 'schrott', label: 'Container', x: 5, y: 5, w: 12, h: 2, color: '#7a3b2a', desc: 'Огороженная площадка с большими контейнерами. Сюда уходит лом — забракованные каркасы.' },
  { id: 'werkbank', label: 'Werkstatt', x: 27, y: 42, w: 3, h: 1, color: '#6b4a2a', desc: 'Мастерская техника: верстак, тиски, ящик с инструментами и запчасти. Когда станок ломается, техник берёт здесь инструмент и идёт чинить.' },
  { id: 'rohgummi', label: 'Rohgummi', x: 44, y: 37, w: 2, h: 2, color: '#2a2a30', desc: 'Сырая (невулканизированная) резина для намотки. Лежит прямо у машин Ж2: её подвозят, ходить за ней не нужно.' },
  { id: 'm2', label: 'М2', x: 21, y: 44, w: 4, h: 2, color: '#4a4f57', desc: 'М2: контейнеры для резиновых отходов и склад Gummilösung. Когда клей на участке кончается, рабочий идёт сюда за канистрой.' },
  { id: 'm1', label: 'М1', x: 70, y: 44, w: 4, h: 2, color: '#4a4f57', desc: 'М1: мусор — металл (проволока, гвозди) и бумага.' },
  { id: 'autoklav1', label: 'Autoklav', x: 55, y: 43, w: 5, h: 3, color: '#4a7db0', desc: 'Единственный автоклав (холодный метод). Работает отдельно от основной линии, на нём один человек. Пока не моделируется.' },
  { id: 'scanner', label: 'Scan', x: 55, y: 29, w: 2, h: 1, color: '#2c6aa8', short: 'Scan', lastScan: -99, desc: 'Ж4: площадка сканера. Шину с обрезки катят через сканер — он читает штрихкод и записывает весь путь шины по цеху.' },
  ...[32, 35, 38, 41, 44, 47].map(x => ({ id: 'kpresse', label: '', x, y: 44, w: 2, h: 2, color: '#6b5a8a', desc: 'Маленький пресс для шин небольших гоночных машин (мягкая резина). Зона Ф — к ней вернёмся позже.' })),
];
const WERKBANK = { x: 28, y: 43 };
const COFFEE = { x: 33, y: 10 };
const M2_ACCESS = { x: 23, y: 43 };
const SCAN_ACCESS = { x: 55, y: 30 };
const FORK_HOMES = [{ x: 19, y: 8 }, { x: 63, y: 21 }]; // стоянки погрузчиков: у приёмки З и у склада С3
for (const d of DECOR) for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) blocked[I(x, y)] = 1;
const SEATS = [[28, 11], [29, 11], [31, 11], [32, 11], [28, 13], [29, 13], [31, 13], [32, 13], [27, 14], [30, 14], [29, 15]];
const EXIT = { x: 40, y: 6 }, ENTRY = { x: 40, y: 5 };
const SCRAP_ACCESS = { x: 11, y: 7 };
// Ворота: З — приёмка каркасов (въезд), Р — пандус отгрузки готовых шин (выезд). Грузовики едут по улице сверху.
const DOCKS = {
  1: { x: 23, stopY: 5.5, access: { x: 23, y: 9 }, label: 'З ANNAHME', rect: { x: 21, y: 3, w: 5, h: 6 } },
  2: { x: 68, stopY: 18, access: { x: 68, y: 22 }, label: 'Р VERSAND', rect: { x: 66, y: 14, w: 5, h: 9 } },
};
const CAM = { z: 1.5, cx: 46.5, cy: 29 }; // стартовый вид пиксельной графики: линия Ж1–Ж4

// ================= Станции =================
// g = группа (тип станции). next — группа, куда шина идёт дальше. loop — станция на подвесном конвейере (Ж1–Ж2).
const WORKS = ['transport', 'pruefen', 'rauen', 'reparatur', 'belegen', 'vulkan', 'nacharbeit', 'technik'];
const WORK_RU = { transport: 'Транспорт', pruefen: 'Контроль', rauen: 'Рауен', reparatur: 'Ремонт шин', belegen: 'Намотка резины', vulkan: 'Прессы', nacharbeit: 'Обрезка', technik: 'Техник (Instandhaltung)' };
const INFO = {
  eingang: ['Eingangslager', 'К1: навес с каркасами', 'Каркасы из грузовика клиента под навесом без стен. Их предварительно смотрят и отбирают плохие.'],
  pruef: ['Eingangsprüfung', 'С2: входной осмотр', 'Станок входного осмотра: каркас вращают и осматривают снаружи и изнутри. Шине клеят полоску со штрихкодом — дальше её сканируют на каждом участке. Порезы корда, разрыв брекера, старость — в лом.'],
  sort: ['Karkassenlager', 'С3: склад каркасов', 'Рассортированные каркасы, готовые к работе. Отсюда их погрузчиком везут к подвесному конвейеру. Здесь же стоит WIP-лимит: сколько шин пускать в линию.'],
  aufh: ['Aufhängen', 'Ж1: навеска на крюки', 'Каркасы вешают на крюки подвесного конвейера (Hängebahn). На крюках они копятся и едут по участкам Ж1 до намотки в Ж2.'],
  rauen: ['Rauen', 'Снятие протектора', 'Рауавтомат вращающейся фрезой снимает остатки старого протектора до нужного радиуса и шероховатости.'],
  ausschl: ['Ausschleifen', 'Зачистка повреждений', 'Пневматическими «болгарками» вычищают дефекты: дыры, порезы — до здоровой резины.'],
  spray: ['Flüssiggummi', 'Нанесение Gummilösung', 'На зачищенную поверхность наносят жидкую резину (Gummilösung). Шина сохнет до липкости. Клей в канистрах: когда кончается, рабочий идёт за ним на М2.'],
  fuellen: ['Spachteln', 'Шпаклёвка дыр', 'Глубокие дефекты заполняют резиной из пистолета-экструдера.'],
  aufbau: ['Aufbau', 'Ж2: намотка сырой резины', 'Машина наматывает на каркас ленту сырой (невулканизированной) резины слой за слоем. Здесь шину снимают с крюка; дальше — тележками по 4 шины.'],
  puffer: ['Wagenplatz', 'Ж3: тележки у прессов', 'Тележки с намотанными шинами ждут свободного пресса.'],
  presse: ['Heizpresse', 'Ж3: пресс с формой', 'Одна шина: внутри её раздувает (Heizbalg), и она прижимается к форме — форма даёт весь рисунок протектора. Около 90 мин вулканизации. Шину заряжают и достают маленьким краном.'],
  entgr: ['Entgraten', 'Ж4: обрезка облоя', 'Шину катят от пресса к вращающемуся станку: срезают облой и выпоры резины по краям. Серьёзный брак — на переделку или в лом.'],
  nacharb: ['Nacharbeit', 'Стеллаж переделки', 'Шины с серьёзным дефектом ждут повторной обработки — снова на крюки, с шероховки.'],
  endk: ['Endkontrolle', 'Ж4: финальный контроль', 'Контроль в машине: чтобы не было никаких проблем. Что пропустит контроль — уедет к клиенту.'],

// ================= Время и экономика =================
function simulate(dt) {
  const prev = clock();
  S.t += dt;
  const c = clock();
  const present = S.workers.filter(w => !w.away).length;
  const wage = present * WAGE_PER_HOUR / 60 * dt; S.money -= wage; S.stats.wages += wage;
  if (prev < SHIFT_CHANGE && c >= SHIFT_CHANGE) log('14:00 — пересменка: Frühschicht уходит, Spätschicht приходит.', 'info');
  if (prev < DAY_END && c >= DAY_END) log('22:00 — конец смены. Ночью работают только автоклавы.', 'info');
  if (c < prev) { // полночь
    S.money -= OVERHEAD_PER_DAY; S.stats.overhead += OVERHEAD_PER_DAY;
    log(`День ${day() - 1}: готово ${S.doneToday} шин, пройдено ${Math.round(S.stats.walkToday * 1.5)} м. Аренда/энергия −${eur(OVERHEAD_PER_DAY)}.`, 'info');
    S.doneYesterday = S.doneToday; S.doneToday = 0; S.stats.walkToday = 0; S.breaksToday = 0;
  }
  if (prev < DAY_START && c >= DAY_START) log(`День ${day()}: 06:00, начало Frühschicht.`, 'info');
  updateTrucks(dt);
  for (let i = S.matOrders.length - 1; i >= 0; i--) { const m = S.matOrders[i]; if (S.t >= m.at) { S.mats[m.key] += m.qty; log(`Поставка: ${m.qty} × ${MATS[m.key].de}.`, 'good'); S.matOrders.splice(i, 1); } }
  if (S.autoBuy) for (const [k, m] of Object.entries(MATS)) { const coming = S.matOrders.filter(o => o.key === k).reduce((a, o) => a + o.qty, 0); if (S.mats[k] + coming < m.min && S.money > m.price) buy(k, true); }
  for (const a of GROUP.presse) {
    if (a.state !== 'running' || a.broken) continue; // сломан — вулканизация на паузе
    a.timer -= dt; a.busy += dt;
    if (isDay() && rnd() < dt / 8000) { breakDown(a); continue; }
    if (a.timer <= 0) { a.state = 'done'; const t = S.tires.get(a.items[0]); if (t) t.stage = 'presse'; }
  }
  if (S.firstBreak && S.t >= S.firstBreak) { S.firstBreak = 0; breakDown(ST.rauen1); } // первая поломка — чтобы сразу увидеть ремонт
  if (S.autoAccept && S.offers.length) { // автопилот мастера: держим в цехе запас работы
    const pipe = S.tires.size + pendingTrucks.filter(p => p.kind === 'deliver').reduce((a, p) => a + p.order.qty, 0);
    if (pipe < 130) { const o = S.offers[0]; log(`Автопринятие: ${o.customer}, ${o.qty} шин.`, 'info'); acceptOffer(o.id); }
  }
  if (S.t - S.lastOffer > 90 && S.offers.length < 5 && isDay()) { S.lastOffer = S.t; makeOffer(); }
  S.offers = S.offers.filter(o => { if (S.t > o.expires) { log(`Запрос ${o.customer} истёк.`, 'muted'); return false; } return true; });
  for (let i = S.complaints.length - 1; i >= 0; i--) { const cpl = S.complaints[i]; if (S.t >= cpl.at) { S.money -= 350; S.stats.penalties += 350; S.rep = Math.max(0, S.rep - 4); log(`Рекламация от ${cpl.order}: брак восстановленной шины (−350 €, репутация −4).`, 'bad'); S.complaints.splice(i, 1); } }
  updateHooks(dt);
  checkOrders();
  assignJobs();
  for (const w of S.workers) updateWorker(w, dt);
}
function advance(minutes) { let left = minutes; while (left > 0) { const d = Math.min(0.25, left); simulate(d); left -= d; } }
function buy(k, auto = false) {
  const m = MATS[k]; if (S.money < m.price) return;
  S.money -= m.price; S.stats.materials += m.price; S.matOrders.push({ key: k, qty: m.pack, at: S.t + 120 });
  log(`${auto ? 'Автозаказ' : 'Заказано'}: ${m.pack} × ${m.de} (${eur(m.price)}), поставка через 2 ч.`);
}

  const r = cv.getBoundingClientRect(), lx = (mx - r.left) / scale, ly = (my - r.top) / scale;
  let x, y;
  if (pixelOn()) { [x, y] = window.PixelGfx.toTile(lx / (MW * TILE), ly / (MH * TILE)); x -= 0.5; y -= 0.5; }
  else { x = lx / TILE - 0.5; y = ly / TILE - 0.5; }
  const lift = pixelOn() ? 0.55 : 0; // в пикселях человечек выше клетки — целимся в туловище
  const w = S.workers.filter(w => !w.away).sort((a, b) => Math.hypot(a.x - x, a.y - lift - y) - Math.hypot(b.x - x, b.y - lift - y))[0];
  if (w && Math.hypot(w.x - x, w.y - lift - y) < 0.8) return { w };
  const tx = Math.floor(x + 0.5), ty = Math.floor(y + 0.5);
  if (tx === HOOK_DRIVE.x && ty === HOOK_DRIVE.y) return { st: HOOK_DRIVE };
  const s = STATIONS.find(s => tx >= s.x && tx < s.x + s.w && ty >= s.y && ty < s.y + s.h); if (s) return { st: s };
  const d = DECOR.find(d => tx >= d.x && tx < d.x + d.w && ty >= d.y && ty < d.y + d.h); if (d) return { d };
  return null;
}
cv.addEventListener('click', e => { S.selected = hitTest(e.clientX, e.clientY); renderSel(); });
cv.addEventListener('mousemove', e => {
  const h = hitTest(e.clientX, e.clientY), tip = $('tip');
  if (h && (h.st || h.d)) { const o = h.st || h.d; tip.innerHTML = `<b>${o.de || o.label}</b>${o.ru ? ` — ${o.ru}` : ''}<div class="muted">${o.desc}</div>`; tip.style.display = 'block'; const wr = $('wrap').getBoundingClientRect(); tip.style.left = Math.min(e.clientX - wr.left + 14, wr.width - 330) + 'px'; tip.style.top = (e.clientY - wr.top + 14) + 'px'; }
  else tip.style.display = 'none';
});
cv.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });
// Камера пиксельного режима: колесо — зум, правая кнопка (или средняя) — тащить, WASD/стрелки — двигать
const viewFrac = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
cv.addEventListener('wheel', e => { if (!pixelOn()) return; e.preventDefault(); const [fx, fy] = viewFrac(e); window.PixelGfx.zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, fx, fy); }, { passive: false });
let drag = null;
cv.addEventListener('contextmenu', e => { if (pixelOn()) e.preventDefault(); });
cv.addEventListener('mousedown', e => { if (pixelOn() && (e.button === 2 || e.button === 1)) { drag = viewFrac(e); e.preventDefault(); } });
window.addEventListener('mousemove', e => { if (!drag) return; const f = viewFrac(e); window.PixelGfx.pan(drag[0] - f[0], drag[1] - f[1]); drag = f; });
window.addEventListener('mouseup', () => { drag = null; });
const PAN = { KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
document.addEventListener('keydown', e => { if (pixelOn() && PAN[e.code]) { window.PixelGfx.pan(PAN[e.code][0] * 0.08, PAN[e.code][1] * 0.08); e.preventDefault(); } if (pixelOn() && (e.key === '+' || e.key === '=')) window.PixelGfx.zoomAt(1.2, 0.5, 0.5); if (pixelOn() && e.key === '-') window.PixelGfx.zoomAt(1 / 1.2, 0.5, 0.5); });
$('zoomIn').addEventListener('click', () => { if (!pixelOn()) setGfx('pixel'); window.PixelGfx.zoomAt(1.25, 0.5, 0.5); });
$('zoomOut').addEventListener('click', () => { if (pixelOn()) window.PixelGfx.zoomAt(1 / 1.25, 0.5, 0.5); });

// ================= Пиксельная графика (pixel.js) =================
const VIEW = { CAM, ctx, TILE, MW, MH, S, grid, I, T_GRASS, T_ROAD, T_YARD, T_FLOOR, T_WALL, T_DOOR, ZONES, DECOR, DOCKS, SEATS, STATIONS, LOOP, HOOKS, HOOK_DRIVE, loopPos, clock, DAY_START, DAY_END, matsOk };
function setGfx(m) {
  S.gfx = m; try { localStorage.setItem('rw-gfx', m); } catch (e) { /* без хранилища */ }
  const b = document.getElementById('gfxBtn'); if (b) b.textContent = m === 'pixel' ? '🎨 Графика: пиксели' : '🎨 Графика: схема';
}
document.getElementById('gfxBtn').addEventListener('click', () => setGfx(S.gfx === 'pixel' ? 'classic' : 'pixel'));
setGfx(S.gfx);

// ================= Главный цикл =================
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.speed > 0) advance(dt * MIN_PER_SEC * S.speed);
  if (S.gfx === 'pixel' && window.PixelGfx) window.PixelGfx.render(VIEW); else render();
  uiT += dt; if (uiT > 0.3) { uiT = 0; renderTop(); renderSel(); if (!document.querySelector('#panel:hover') || tab === 'log') renderPanel(); }
  requestAnimationFrame(frame);
}
// Старт: цех уже работает — два заказа в производстве, шины на участках, автоклав греет, едет грузовик
function prefill() {
  const order = (customer, qty, price, dl, state = 'production') => { const o = { id: S.nextId++, customer, qty, price, deadline: S.t + dl, expires: S.t, state, finished: 0, scrapped: 0, shippedN: 0 }; S.orders.push(o); return o; };
  const tire = (o, stage, bad = 0.04) => { const t = { id: S.nextTire++, order: o.id, badCasing: rnd() < bad, defect: false, rework: 0, stage, readyAt: 0, res: false, dest: null, tIn: S.t - RI(120, 900), trace: [] }; if (stage !== 'karkasse') t.code = 'RW' + String(t.id).padStart(5, '0'); S.tires.set(t.id, t); return t.id; };
  const a = order('Spedition Krause', 36, 205, 1300), b = order('Busbetrieb Schäfer', 20, 215, 1900);
  for (let k = 0; k < 12; k++) { ST.fertig.items.push(tire(a, 'fertig', 0)); a.finished++; } // готово к отгрузке → скоро приедет грузовик
  GROUP.presse.forEach((p, k) => { if (k < 8) { p.items.push(tire(a, 'aufbau')); Object.assign(p, { state: 'running', timer: 8 + k * 10 }); } }); // 8 из 10 прессов греют
  for (let k = 0; k < 4; k++) ST.puffer.items.push(tire(a, 'aufbau'));
  for (let k = 0; k < 4; k++) ST.sort.items.push(tire(a, 'pruef'));
  const PREV = { pruef: 'karkasse', rauen: 'aufh', ausschl: 'rauen', spray: 'ausschl', fuellen: 'spray', aufbau: 'fuellen', entgr: 'presse', endk: 'entgr' };
  for (const [id, o, n] of [['entgr1', a, 3], ['entgr2', a, 1], ['endk', a, 1], ['aufbau1', a, 1], ['aufbau2', a, 1], ['fuellen', a, 1],
    ['spray', b, 1], ['ausschl1', b, 1], ['ausschl2', b, 1], ['rauen1', b, 1], ['rauen2', b, 1], ['pruef1', b, 1], ['pruef2', b, 1]]) {
    for (let k = 0; k < n; k++) ST[id].input.push(tire(o, PREV[ST[id].g], ST[id].g === 'pruef' ? 0.13 : 0.04));
  }
  for (let k = 0; k < 4; k++) ST.aufh.items.push(tire(b, 'pruef'));
  for (let k = 0; k < 9; k++) ST.eingang.items.push(tire(b, 'karkasse', 0.13));
  const c = order('Kühltransporte Nord', 16, 210, 2400, 'incoming');
  pendingTrucks.push({ kind: 'deliver', order: c, at: S.t + 12 });
  for (const s of [ST.rauen1, ST.ausschl1, ST.entgr2]) s.dirt = 0.3; // с ночи осталась пыль — будет что подметать
}
if (params.get('empty') !== '1') prefill();
makeOffer(); makeOffer();
resize(); renderTop(); renderSel(); renderPanel();
log('Добро пожаловать в Reifenwerk! Цех построен по эталону: горячий метод — крюки в Ж1–Ж2, намотка сырой резины, 10 прессов с формами, обрезка, сканер, контроль, отгрузка через пандус Р. 2 заказа уже в производстве, грузовик подъезжает к воротам З. Заказы принимаются автоматически (вкладка «Заказы»).', 'info');
requestAnimationFrame(frame);

// ================= API для автоматической игры и тестов =================
window.RW = {
  S, ST, STATIONS, GROUP, HOOKS, VIEW, advance, acceptOffer, declineOffer, buy, hire, wipCount, setHook, setGfx,
  setSpeed: v => { S.speed = v; renderTop(); },
  setPrio: (name, work, p) => { const w = S.workers.find(w => w.name.startsWith(name)); if (w) w.prio[work] = p; },
  summary: () => ({
    day: day(), clock: fmtClock(clock()), money: Math.round(S.money), rep: Math.round(S.rep), shipped: S.shipped, scrap: S.scrap,
    doneToday: S.doneToday, doneYesterday: S.doneYesterday, leadMin: avgLead(), walkTodayM: Math.round(S.stats.walkToday * 1.5), wip: `${wipCount()}/${S.wip}`, hooksBusy: HOOKS.filter(h => h.tire).length,
    stations: Object.fromEntries(STATIONS.map(s => [s.id, s.kind === 'proc' ? `${s.input.length}>${s.cur ? 1 : 0}>${s.out.length} ${util(s)}%` : s.kind === 'auto' ? `${s.state}:${s.items.length} ${util(s)}%` : String(s.items.length)])),
    workers: S.workers.map(w => `${w.name.split(' ')[0]}(${w.shift}): ${jobText(w)} (${Math.round(w.energy)}%)`),
    offers: S.offers.map(o => `${o.id} ${o.customer} ${o.qty}×${o.price}`),
    orders: S.orders.filter(o => o.state !== 'done').map(o => `${o.customer} ${o.state} ${o.finished}/${o.qty} лом ${o.scrapped}`),
    mats: { ...S.mats }, trucks: S.trucks.map(t => `${t.kind} ${t.state} ${t.cargo.length}`),
    breakdowns: S.stats.breakdowns, broken: MACHINES.filter(m => m.broken).map(m => `${m.id}: ${m.broken.de} ${m.broken.tech ? Math.round(m.broken.done / m.broken.need * 100) + '%' : 'ждёт'}`),
    downtimeMin: Math.round(S.stats.downtime), repairsEur: S.stats.repairs,
  }),
  MACHINES, breakDown,
};
})();
</script>
